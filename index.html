<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Ghost Market</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--c:#16161f;--c2:#1e1e2a;--b:#26262f;--t:#ededf2;--t2:#8b8b98;--t3:#5c5c68;--a:#ffd60a;--ok:#22c55e;--dn:#ef4444;--in:#5b8cff}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden;min-height:100vh}
a{color:var(--in);cursor:pointer;text-decoration:none}
input,textarea,select{width:100%;padding:13px 15px;background:var(--c2);border:1px solid var(--b);border-radius:11px;color:var(--t);font-family:inherit;font-size:15px;margin-bottom:10px;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}
input::placeholder,textarea::placeholder{color:var(--t3)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
button{background:var(--a);color:#000;border:0;padding:13px 18px;border-radius:11px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:46px}
button:active{opacity:.75}
button.sec{background:var(--c2);color:var(--t);border:1px solid var(--b)}
button.dgr{background:var(--dn);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:9px}
button.full{width:100%}
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:10px 14px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.5px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--a)}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);flex-wrap:wrap}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),#ff8a00);color:#000;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--t2);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px;white-space:nowrap;position:relative}
nav a.on{background:var(--c2);color:var(--t)}
nav a .b{position:absolute;top:2px;right:2px;background:var(--dn);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:700;margin-bottom:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.err{background:rgba(239,68,68,.12);color:#fca5a5;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(239,68,68,.25)}
.suc{background:rgba(34,197,94,.12);color:#86efac;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(34,197,94,.25)}
.wrn{background:rgba(255,214,10,.08);color:#ffe94d;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;border:1px solid rgba(255,214,10,.2);line-height:1.5}
.inf{background:rgba(91,140,255,.1);color:#93b0ff;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(91,140,255,.25)}
.hint{color:var(--t2);font-size:12px;margin-top:6px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.item{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;cursor:pointer}
.cat{color:var(--a);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.item h3{font-size:15px;margin:5px 0 8px;line-height:1.3}
.item p{color:var(--t2);font-size:12px;margin-bottom:10px;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;font-size:17px;color:var(--a);white-space:nowrap}
.st{padding:3px 9px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(91,140,255,.15);color:var(--in);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.st-active,.st-completed,.st-paid_out,.st-approved{background:rgba(34,197,94,.15);color:#86efac}
.st-pending,.st-awaiting_payment,.st-result_submitted{background:rgba(255,214,10,.15);color:#ffe94d}
.st-in_progress{background:rgba(91,140,255,.18);color:#93b0ff}
.st-disputed,.st-rejected,.st-cancelled{background:rgba(239,68,68,.15);color:#fca5a5}
.st-closed{background:rgba(139,139,152,.15);color:var(--t2)}
.fil{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fil::-webkit-scrollbar{display:none}
.fil select,.fil input{margin:0;flex:0 0 140px;padding:10px 12px;font-size:13px}
.fil button{flex:0 0 auto;padding:10px 16px;min-height:40px;font-size:13px}
.hero{background:linear-gradient(135deg,#1e1e2a,#16161f);border:1px solid var(--b);border-radius:18px;padding:22px;margin-bottom:12px}
.bal{font-size:34px;font-weight:800;letter-spacing:-1px}
.bal span{color:var(--t2);font-size:22px}
.wacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.wacts button{min-height:50px}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--c2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 12px;text-align:center;cursor:pointer;border-radius:9px;color:var(--t2);font-size:12px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--c);color:var(--t)}
.msgs{max-height:55vh;overflow-y:auto;margin-bottom:10px;padding:8px;background:var(--bg);border-radius:12px;border:1px solid var(--b)}
.msg{padding:9px 12px;background:var(--c2);border-radius:12px;margin-bottom:6px;max-width:82%}
.msg.mine{background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.2);margin-left:auto}
.msg .who{font-size:10px;font-weight:700;color:var(--a);margin-bottom:3px}
.msg p{font-size:14px;word-break:break-word}
.msg small{color:var(--t3);font-size:9px}
.cform{display:flex;gap:6px}.cform input{margin:0}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
th,td{padding:9px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{color:var(--t2);font-size:10px;text-transform:uppercase}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--dn);font-weight:700}
.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.acard{width:100%;max-width:400px}
.alogo{text-align:center;font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
.alogo span{color:var(--a)}
.asub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:22px}
.tst{position:fixed;top:14px;left:14px;right:14px;z-index:2000;background:var(--c);color:var(--t);padding:13px 16px;border-radius:12px;border:1px solid var(--b);box-shadow:0 20px 40px rgba(0,0,0,.5);font-size:13px}
@media(min-width:480px){.tst{left:auto;right:20px;max-width:340px}}
.tst.error{border-color:rgba(239,68,68,.5);color:#fca5a5}
.tst.success{border-color:rgba(34,197,94,.5);color:#86efac}
.empty{text-align:center;padding:36px 20px;color:var(--t3);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--c2);color:var(--t2)}
.bdg.adm{background:var(--a);color:#000}
.bdg.new{background:var(--dn);color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t3);margin-right:5px}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sbox{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:13px}
.sbox small{color:var(--t2);font-size:11px;display:block;margin-bottom:4px}
.sbox .v{font-size:20px;font-weight:800}
.citem{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.citem.un{border-color:var(--a);background:rgba(255,214,10,.04)}
.citem-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.citem-n{font-weight:700;font-size:14px}
.citem-p{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,214,10,.12);color:var(--a);font-family:ui-monospace,monospace;font-weight:700;font-size:11px}
.idbig{background:linear-gradient(135deg,rgba(255,214,10,.14),rgba(255,140,0,.06));border:1px solid rgba(255,214,10,.3);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.idbig .lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.idbig .val{font-family:ui-monospace,monospace;font-size:30px;font-weight:800;color:var(--a);letter-spacing:4px;line-height:1;margin-bottom:12px}
.stars{color:var(--a);font-size:13px;letter-spacing:1px}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--t2);font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
window.onerror=function(m,u,l,c){document.getElementById('app').innerHTML='<div style="padding:20px;color:#f66;font-size:14px"><b>Ошибка:</b><br>'+m+'<br><br>Строка: '+l+'</div>';return false};
try{
var CFG={apiKey:"AIzaSyBFpwNqfxsYAdAvcaW5HeTelGTtaA_zPbE",authDomain:"ghost-market-b7a80.firebaseapp.com",databaseURL:"https://ghost-market-b7a80-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ghost-market-b7a80",storageBucket:"ghost-market-b7a80.firebasestorage.app",messagingSenderId:"67074440378",appId:"1:67074440378:web:f505b077262e2e4ab29683"};
firebase.initializeApp(CFG);
}catch(e){document.getElementById('app').innerHTML='<div style="padding:20px;color:#f66">Firebase не загрузился. Проверь интернет.<br>'+e.message+'</div>'}

var auth=firebase.auth(),DB=firebase.database().ref('gm');
var ADMIN_CODE='GHOST-ADMIN-2025';
var CATS=['Домашнее задание','Реферат','Курсовая работа','Презентация','Контрольная работа','Эссе / сочинение','Покупка и доставка (еда, напитки, в колледж)','Другое'];
var HINTS={'Домашнее задание':'Задачи, упражнения, параграфы','Реферат':'Обзор темы, список литературы','Курсовая работа':'Полный текст','Презентация':'Слайды с текстом','Контрольная работа':'Решение варианта','Эссе / сочинение':'200–500 слов','Покупка и доставка (еда, напитки, в колледж)':'Купить и привезти','Другое':'Опишите'};
var DS={awaiting_payment:'Ожидает оплаты',in_progress:'В работе',result_submitted:'Результат отправлен',paid_out:'Выполнено',cancelled:'Отменено',disputed:'Спор',refunded:'Возврат'};

var D={users:{},lots:{},chats:{},msgs:{},deals:{},txs:{},deps:{},wds:{},disps:{},revs:{},settings:{}};
var FU=null,SID=localStorage.getItem('gm_sid'),route={name:'home',params:{}};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toFixed(2)+' ₽'}
function dt(ts){return new Date(ts||Date.now()).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function ini(n){return (n||'?').split(' ').map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function onl(u){return u&&u.lastSeen&&(Date.now()-u.lastSeen<5*60*1000)}
function me(){return SID?D.users[SID]:null}
function uByPid(pid){var k=Object.keys(D.users);for(var i=0;i<k.length;i++){if(String(D.users[k[i]].publicId)===String(pid))return[k[i],D.users[k[i]]]}return null}
function unl(u){return u&&(u.isUnlimited||u.role==='admin')}
function toast(m,t){var e=document.createElement('div');e.className='tst '+(t||'');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3000)}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Скопировано','success')}).catch(function(){fb(t)});else fb(t)}
function fb(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано','success')}catch(e){toast('Ошибка','error')}a.remove()}
function nav(n,p){route={name:n,params:p||{}};render();window.scrollTo(0,0)}
function fp(){try{var s=[navigator.userAgent||'',navigator.language||'',screen.width+'x'+screen.height].join('|');var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return'DEV-'+Math.abs(h).toString(36).toUpperCase()}catch(e){return'DEV-X'}}
function genPid(){var ids=Object.keys(D.users).map(function(k){return String(D.users[k].publicId)});var i;do{i=String(Math.floor(10000000+Math.random()*90000000))}while(ids.indexOf(i)>=0);return i}

function holdFunds(userId,dealId,amt){
  var k='hold-'+dealId;
  var exists=Object.keys(D.txs).filter(function(id){return D.txs[id].idempotencyKey===k});
  if(exists.length)return{ok:true};
  var u=D.users[userId];if(!u)return{ok:false,error:'Нет юзера'};
  if(unl(u)){var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:userId,dealId:dealId,type:'hold',amount:-amt,balanceAfter:0,idempotencyKey:k,createdAt:Date.now()});return{ok:true}}
  if((u.balance||0)<amt)return{ok:false,error:'Недостаточно средств'};
  var nb=(u.balance||0)-amt;
  DB.child('users/'+userId).update({balance:nb,heldBalance:(u.heldBalance||0)+amt});
  var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:userId,dealId:dealId,type:'hold',amount:-amt,balanceAfter:nb,idempotencyKey:k,createdAt:Date.now()});
  return{ok:true}
}
function release(dealId){
  var d=D.deals[dealId];if(!d||!d.executorId)return;
  var c=D.users[d.customerId],e=D.users[d.executorId];if(!c||!e)return;
  var pay=+(d.price*(1-d.commissionRate)).toFixed(2),com=+(d.price*d.commissionRate).toFixed(2);
  if(!unl(c))DB.child('users/'+c.id+'/heldBalance').set(Math.max(0,(c.heldBalance||0)-d.price));
  if(!unl(e))DB.child('users/'+e.id).update({balance:(e.balance||0)+pay,totalEarned:(e.totalEarned||0)+pay});
  var t1=uid();DB.child('txs/'+t1).set({id:t1,userId:e.id,dealId:dealId,type:'payout',amount:pay,createdAt:Date.now()});
  var t2=uid();DB.child('txs/'+t2).set({id:t2,userId:c.id,dealId:dealId,type:'commission',amount:-com,createdAt:Date.now()});
}
function refund(dealId){
  var d=D.deals[dealId];if(!d)return;
  var u=D.users[d.customerId];if(!u||unl(u))return;
  var nb=(u.balance||0)+d.price;
  DB.child('users/'+u.id).update({balance:nb,heldBalance:Math.max(0,(u.heldBalance||0)-d.price)});
  var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:u.id,dealId:dealId,type:'refund',amount:d.price,balanceAfter:nb,createdAt:Date.now()});
}

DB.on('value',function(s){
  var v=s.val()||{};
  D={users:v.users||{},lots:v.lots||{},chats:v.chats||{},msgs:v.msgs||{},deals:v.deals||{},txs:v.txs||{},deps:v.deps||{},wds:v.wds||{},disps:v.disps||{},revs:v.revs||{},settings:v.settings||{}};
  render();
});

auth.onAuthStateChanged(function(user){
  if(user){
    FU=user;SID=user.uid;localStorage.setItem('gm_sid',SID);
    DB.child('users/'+user.uid).update({lastSeen:Date.now(),deviceId:fp()});
    var u=D.users[user.uid];
    if(!u||!u.ip||u.ip==='—'){
      fetch('https://api.ipify.org?format=json').then(function(r){return r.json()}).then(function(d){DB.child('users/'+user.uid+'/ip').set(d.ip||'—')}).catch(function(){});
    }
  }else{
    FU=null;SID=null;localStorage.removeItem('gm_sid');
  }
  render();
});

function render(){
  var u=me();
  if(SID&&u&&['login','register'].indexOf(route.name)>=0){
    route={name:'home',params:{}};
  }
  var isAuth=['login','register'].indexOf(route.name)>=0;
  var c='';
  if(route.name==='login')c=pgLogin();
  else if(route.name==='register')c=pgReg();
  else if(route.name==='home')c=pgHome();
  else if(route.name==='lot')c=pgLot(route.params);
  else if(route.name==='create-lot')c=pgCreateLot();
  else if(route.name==='mylots')c=pgMyLots();
  else if(route.name==='chats')c=pgChats();
  else if(route.name==='chat')c=pgChat(route.params);
  else if(route.name==='deals')c=pgDeals();
  else if(route.name==='deal')c=pgDeal(route.params);
  else if(route.name==='wallet')c=pgWallet(route.params);
  else if(route.name==='admin')c=pgAdmin(route.params);
  else c=pgHome();

  var unread=0;
  if(u){var chk=Object.keys(D.chats);for(var i=0;i<chk.length;i++){var x=D.chats[chk[i]];if((x.customerId===SID&&x.cU)||(x.executorId===SID&&x.eU))unread++}}
  var nnew=0;
  if(u&&u.role==='admin'){var uk=Object.keys(D.users);for(var j=0;j<uk.length;j++){if(D.users[uk[j]].isNew)nnew++}}

  var hdr=isAuth?'':'<header class="hdr"><div class="hrow"><div class="logo" onclick="nav(\'home\')">Ghost<span>Market</span></div><div class="chip">'+
    (u?('<div class="av">'+esc(ini(u.fullName))+'</div><span class="pid">'+esc(u.publicId)+'</span><button class="sec sm" onclick="logout()">Выйти</button>'):'<button class="sm" onclick="nav(\'login\')">Войти</button>')+
    '</div></div><nav>'+
    '<a class="'+(route.name==='home'?'on':'')+'" onclick="nav(\'home\')">Лоты</a>'+
    (u?'<a class="'+(route.name==='chats'?'on':'')+'" onclick="nav(\'chats\')">Чаты'+(unread?'<span class="b">'+unread+'</span>':'')+'</a>':'')+
    (u?'<a class="'+(route.name==='deals'?'on':'')+'" onclick="nav(\'deals\')">Сделки</a>':'')+
    (u&&u.role!=='customer'?'<a class="'+(route.name==='mylots'?'on':'')+'" onclick="nav(\'mylots\')">Мои лоты</a>':'')+
    (u?'<a class="'+(route.name==='wallet'?'on':'')+'" onclick="nav(\'wallet\')">Кошелёк · '+(unl(u)?'∞':(u.balance||0).toFixed(0)+' ₽')+'</a>':'')+
    (u&&u.role==='admin'?'<a class="'+(route.name==='admin'?'on':'')+'" onclick="nav(\'admin\')">Админ'+(nnew?'<span class="b">'+nnew+'</span>':'')+'</a>':'')+
    '</nav></header>';

  document.getElementById('app').innerHTML=hdr+'<div class="wrap">'+c+'</div>';
  var m=document.getElementById('cmsgs');if(m)m.scrollTop=m.scrollHeight;
}

// HANDLERS
window.doLogin=function(e){e.preventDefault();var fd=new FormData(e.target);auth.signInWithEmailAndPassword(fd.get('email').trim().toLowerCase(),fd.get('password')).then(function(){toast('Добро пожаловать','success')}).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'})};
window.doReg=function(e){
  e.preventDefault();var fd=new FormData(e.target);
  var email=fd.get('email').trim().toLowerCase(),pw=fd.get('password'),name=fd.get('fullName').trim(),role=fd.get('role'),ac=(fd.get('adminCode')||'').trim();
  if(pw.length<6){document.getElementById('aerr').innerHTML='<div class="err">Пароль слишком короткий</div>';return}
  auth.createUserWithEmailAndPassword(email,pw).then(function(cred){
    var uid_=cred.user.uid;
    var pid=genPid();
    var isAdmin=ac===ADMIN_CODE;
    var user={id:uid_,publicId:pid,email:email,fullName:name,role:isAdmin?'admin':role,balance:0,heldBalance:0,totalEarned:0,blocked:false,isUnlimited:isAdmin,ip:'—',deviceId:fp(),lastSeen:Date.now(),rating:0,ratingCount:0,isNew:!isAdmin,createdAt:Date.now()};
    DB.child('users/'+uid_).set(user).then(function(){
      cred.user.sendEmailVerification().catch(function(){});
      toast('Аккаунт создан!','success');
      nav('home');
    });
  }).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'});
};
window.logout=function(){auth.signOut().then(function(){SID=null;FU=null;localStorage.removeItem('gm_sid');route={name:'login',params:{}};render()})};
window.doCreateLot=function(e){e.preventDefault();var fd=new FormData(e.target);var u=me();if(!u)return;var id=uid();DB.child('lots/'+id).set({id:id,executorId:u.id,title:fd.get('title').trim(),category:fd.get('category'),description:fd.get('description').trim(),price:Number(fd.get('price')),status:'active',createdAt:Date.now()}).then(function(){toast('Лот создан','success');nav('mylots')})};
window.closeLot=function(id){if(!confirm('Закрыть лот?'))return;DB.child('lots/'+id+'/status').set('closed').then(function(){toast('Лот закрыт');render()})};
window.startChat=function(lotId){
  if(!SID)return;var l=D.lots[lotId];if(!l)return;
  var exist=null;
  Object.keys(D.chats).forEach(function(k){var c=D.chats[k];if(c.lotId===lotId&&c.customerId===SID&&c.executorId===l.executorId)exist=c});
  if(exist){nav('chat',{id:exist.id});return}
  var id=uid();
  DB.child('chats/'+id).set({id:id,lotId:lotId,customerId:SID,executorId:l.executorId,lastAt:Date.now(),lastMsg:'Чат создан'}).then(function(){nav('chat',{id:id})});
};
window.sendMsg=function(e,chatId){
  e.preventDefault();
  var inp=document.getElementById('cinp');var body=inp.value.trim();if(!body)return;
  var id=uid();
  DB.child('msgs/'+chatId+'/'+id).set({id:id,chatId:chatId,senderId:SID,body:body,createdAt:Date.now()}).then(function(){
    var c=D.chats[chatId]||{};
    var upd={lastAt:Date.now(),lastMsg:body.slice(0,60)};
    if(c.customerId===SID)upd.eU=true;else upd.cU=true;
    DB.child('chats/'+chatId).update(upd);
    inp.value='';
  });
};
window.showDF=function(id){var e=document.getElementById('df');if(e){e.style.display='block';e.scrollIntoView({behavior:'smooth'})}};
window.doCreateDeal=function(chatId,custId,execId){
  var u=me();if(!u)return;
  var title=document.getElementById('d-title').value.trim();
  var price=Number(document.getElementById('d-price').value);
  if(!title||!price||price<10){document.getElementById('derr').innerHTML='<div class="err">Заполните</div>';return}
  var id=uid();
  DB.child('deals/'+id).set({id:id,chatId:chatId,customerId:custId,executorId:execId,title:title,price:price,commissionRate:(D.settings&&D.settings.commissionRate)||0.1,status:'awaiting_payment',createdAt:Date.now()}).then(function(){toast('Сделка создана','success');nav('deal',{id:id})});
};
window.payDeal=function(id){
  var d=D.deals[id];var u=me();if(!d||!u)return;
  var r=holdFunds(u.id,id,d.price);
  if(!r.ok){toast(r.error,'error');return}
  DB.child('deals/'+id).update({status:'in_progress'}).then(function(){toast('Оплачено','success');render()});
};
window.cancelDeal=function(id){
  if(!confirm('Отменить?'))return;
  var d=D.deals[id];if(!d)return;
  if(['in_progress','result_submitted'].indexOf(d.status)>=0)refund(id);
  DB.child('deals/'+id).update({status:'cancelled'}).then(function(){toast('Отменено');render()});
};
window.submitRes=function(id){
  var t=document.getElementById('res-t').value.trim();
  if(!t){toast('Введите результат','error');return}
  DB.child('deals/'+id).update({resultText:t,status:'result_submitted'}).then(function(){toast('Отправлено','success');render()});
};
window.confirmDeal=function(id){
  if(!confirm('Подтвердить?'))return;
  var d=D.deals[id];if(!d)return;
  release(id);
  DB.child('deals/'+id).update({status:'paid_out'}).then(function(){toast('Оплата переведена','success');render()});
};
window.doReview=function(dealId,toId,starsCount){
  var u=me();if(!u)return;
  var id=uid();
  DB.child('revs/'+id).set({id:id,dealId:dealId,fromId:SID,toId:toId,stars:starsCount,createdAt:Date.now()}).then(function(){
    var t=D.users[toId];
    if(t){var cnt=(t.ratingCount||0)+1;var nr=((t.rating||0)*(t.ratingCount||0)+starsCount)/cnt;DB.child('users/'+toId).update({rating:nr,ratingCount:cnt})}
    toast('Спасибо','success');render();
  });
};
window.doDispute=function(dealId){
  var r=document.getElementById('dr').value.trim();
  if(r.length<5){toast('Опишите','error');return}
  var id=uid();
  DB.child('disps/'+id).set({id:id,dealId:dealId,initiatorId:SID,reason:r,status:'open',createdAt:Date.now()}).then(function(){
    DB.child('deals/'+dealId+'/status').set('disputed');
    toast('Спор открыт','success');render();
  });
};
window.doDep=function(){
  var u=me();if(!u)return;
  var amt=Number(document.getElementById('dep-a').value);
  var cmt=document.getElementById('dep-c').value.trim();
  if(!amt||amt<10){toast('Минимум 10 ₽','error');return}
  var id=uid();
  DB.child('deps/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,comment:cmt,status:'pending',createdAt:Date.now()}).then(function(){toast('Заявка отправлена','success');nav('wallet',{tab:'dep'})});
};
window.doWd=function(){
  var u=me();if(!u)return;
  var amt=Number(document.getElementById('wd-a').value);
  var svc=document.getElementById('wd-s').value;
  var dst=document.getElementById('wd-d').value.trim();
  var mw=(D.settings&&D.settings.minWithdraw)||300;
  if(!amt||amt<mw){toast('Минимум '+money(mw),'error');return}
  if(amt>(u.balance||0)){toast('Недостаточно','error');return}
  if(dst.length<5){toast('Укажите реквизиты','error');return}
  var id=uid();
  DB.child('users/'+SID).update({balance:(u.balance||0)-amt}).then(function(){
    DB.child('wds/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,service:svc,dest:dst,status:'pending',createdAt:Date.now()});
    var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:SID,type:'withdrawal',amount:-amt,balanceAfter:(u.balance||0)-amt,createdAt:Date.now()});
    toast('Заявка создана','success');nav('wallet',{tab:'wd'});
  });
};
window.adminCredit=function(){
  var pid=document.getElementById('mc-i').value.trim();
  var amt=Number(document.getElementById('mc-a').value);
  var el=document.getElementById('mcr');
  if(!pid){el.innerHTML='<div class="err">Введите ID</div>';return}
  if(!amt||amt<=0){el.innerHTML='<div class="err">Введите сумму</div>';return}
  var res=uByPid(pid);
  if(!res){el.innerHTML='<div class="err">ID '+esc(pid)+' не найден</div>';return}
  var userId=res[0],uu=res[1];
  var nb=(uu.balance||0)+amt;
  DB.child('users/'+userId+'/balance').set(nb).then(function(){
    var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:userId,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});
    el.innerHTML='<div class="suc">✓ Зачислено '+money(amt)+' для <b>'+esc(uu.fullName)+'</b></div>';
    document.getElementById('mc-i').value='';
  });
};
window.adminQuick=function(pid){
  var res=uByPid(String(pid));
  if(!res){toast('Не найден','error');return}
  var id=res[0],uu=res[1];
  var s=prompt('Зачислить '+uu.fullName+'\nБаланс: '+money(uu.balance||0)+'\n\nСумма в ₽:','300');
  if(s===null)return;
  var amt=Number(s);if(!amt||amt<=0)return;
  var nb=(uu.balance||0)+amt;
  DB.child('users/'+id+'/balance').set(nb).then(function(){
    var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:id,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});
    toast('Зачислено '+money(amt),'success');render();
  });
};
window.adminDep=function(id,act){
  var d=D.deps[id];if(!d||d.status!=='pending')return;
  if(act==='ok'){
    var uu=D.users[d.userId];if(!uu)return;
    var nb=(uu.balance||0)+d.amount;
    DB.child('users/'+d.userId+'/balance').set(nb).then(function(){
      var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:d.userId,type:'deposit',amount:d.amount,balanceAfter:nb,createdAt:Date.now()});
      DB.child('deps/'+id+'/status').set('approved');
      toast('Зачислено','success');render();
    });
  }else{
    DB.child('deps/'+id+'/status').set('rejected').then(function(){toast('Отклонено');render()});
  }
};
window.adminWd=function(id,act){
  var w=D.wds[id];if(!w||w.status!=='pending')return;
  if(act==='ok'){
    DB.child('wds/'+id+'/status').set('completed').then(function(){toast('Готово');render()});
  }else{
    var uu=D.users[w.userId];
    if(uu){
      var nb=(uu.balance||0)+w.amount;
      DB.child('users/'+w.userId+'/balance').set(nb);
      var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:w.userId,type:'refund',amount:w.amount,balanceAfter:nb,createdAt:Date.now()});
    }
    DB.child('wds/'+id+'/status').set('rejected').then(function(){toast('Возвращено');render()});
  }
};
window.adminDisp=function(id,res){
  var d=D.disps[id];if(!d||d.status!=='open')return;
  var deal=D.deals[d.dealId];if(!deal)return;
  if(res==='refund'){refund(d.dealId);DB.child('deals/'+d.dealId+'/status').set('refunded')}
  else{release(d.dealId);DB.child('deals/'+d.dealId+'/status').set('paid_out')}
  DB.child('disps/'+id).update({status:'resolved',resolution:res}).then(function(){toast('Спор решён');render()});
};
window.adminBlock=function(id){
  var uu=D.users[id];if(!uu)return;
  DB.child('users/'+id+'/blocked').set(!uu.blocked).then(function(){toast(uu.blocked?'Разблокирован':'Заблокирован','success');render()});
};
window.adminSave=function(){
  DB.child('settings').update({
    cardNumber:document.getElementById('s-card').value.trim(),
    cardHolder:document.getElementById('s-holder').value.trim(),
    bankName:document.getElementById('s-bank').value.trim(),
    commissionRate:Number(document.getElementById('s-comm').value)/100,
    minDeposit:Number(document.getElementById('s-md').value)||100,
    minWithdraw:Number(document.getElementById('s-mw').value)||300
  }).then(function(){toast('Сохранено','success')});
};
window.adminMark=function(){
  Object.keys(D.users).forEach(function(id){if(D.users[id].isNew)DB.child('users/'+id+'/isNew').set(false)});
  toast('Все прочитаны','success');render();
};
window.applyF=function(){
  var c=document.getElementById('f-c').value;
  var mn=Number(document.getElementById('f-mn').value)||0;
  var mx=Number(document.getElementById('f-mx').value)||Infinity;
  var lots=Object.keys(D.lots).map(function(k){return D.lots[k]}).filter(function(l){return l.status==='active'});
  if(c)lots=lots.filter(function(l){return l.category===c});
  lots=lots.filter(function(l){return l.price>=mn&&l.price<=mx});
  document.getElementById('lots').innerHTML=renderLots(lots.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}));
};
window.updHint=function(){
  var s=document.getElementById('cs').value;
  document.getElementById('ch').textContent=HINTS[s]||'';
};

render();
</script>
</body>
</html>
