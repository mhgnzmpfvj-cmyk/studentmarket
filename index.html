<head>

<title>Ghost Market</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/Q9AKrv3.png">

<style>
:root{--bg:#0a0a0f;--c:#16161f;--c2:#1e1e2a;--b:#26262f;--t:#ededf2;--t2:#8b8b98;--t3:#5c5c68;--a:#ffd60a;--ok:#22c55e;--dn:#ef4444;--in:#5b8cff;--sh:0 1px 3px rgba(0,0,0,.06)}
[data-theme="light"]{--bg:#f5f6fa;--c:#fff;--c2:#f0f1f5;--b:#e5e7eb;--t:#111827;--t2:#6b7280;--t3:#9ca3af;--a:#f5b800;--ok:#16a34a;--dn:#dc2626;--in:#2563eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden;min-height:100vh;transition:background-color .25s,color .2s}
a{color:var(--in);cursor:pointer;text-decoration:none}
input,textarea,select{width:100%;padding:13px 15px;background:var(--c2);border:1px solid var(--b);border-radius:11px;color:var(--t);font-family:inherit;font-size:15px;margin-bottom:10px;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}
input::placeholder,textarea::placeholder{color:var(--t3)}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
button{background:var(--a);color:#000;border:0;padding:13px 18px;border-radius:11px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:46px;transition:transform .1s,opacity .15s}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4}
button.sec{background:var(--c2);color:var(--t);border:1px solid var(--b)}
button.dgr{background:var(--dn);color:#fff}
button.ok{background:var(--ok);color:#fff}
button.sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:9px}
button.full{width:100%}
.hdr{position:sticky;top:0;z-index:100;background:var(--c);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:10px 14px;box-shadow:var(--sh)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0}
.logo span.mkt{color:var(--a)}
.chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);flex-wrap:nowrap;min-width:0}
.chip .pid{max-width:80px;overflow:hidden;text-overflow:ellipsis}
.chip .av{flex-shrink:0}
.chip .theme-btn{flex-shrink:0;min-width:28px;min-height:28px;font-size:13px}
.chip button.sec.sm{padding:6px 10px;font-size:12px;min-height:30px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),#ff8a00);color:#000;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--t2);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px;white-space:nowrap;position:relative}
nav a.on{background:var(--c2);color:var(--t)}
nav a .b{position:absolute;top:2px;right:2px;background:var(--dn);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 100px;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
h3{font-size:15px;font-weight:700;margin-bottom:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);animation:fi .25s}
.err{background:rgba(239,68,68,.12);color:#fca5a5;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(239,68,68,.25)}
.suc{background:rgba(34,197,94,.12);color:#86efac;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(34,197,94,.25)}
.wrn{background:rgba(255,214,10,.08);color:#a16207;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:12px;border:1px solid rgba(255,214,10,.3);line-height:1.5}
[data-theme="dark"] .wrn{color:#ffe94d}
.inf{background:rgba(91,140,255,.1);color:#2563eb;padding:11px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(91,140,255,.3)}
[data-theme="dark"] .inf{color:#93b0ff}
.hint{color:var(--t2);font-size:12px;margin-top:6px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.item{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s}
.item:active{transform:scale(.98)}
.cat{color:var(--a);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.item h3{font-size:15px;margin:5px 0 8px;line-height:1.3}
.item p{color:var(--t2);font-size:12px;margin-bottom:10px;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;font-size:17px;color:var(--a);white-space:nowrap}
.st{padding:3px 9px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(91,140,255,.15);color:var(--in);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.st-open,.st-active,.st-completed,.st-paid_out,.st-approved,.st-done{background:rgba(34,197,94,.15);color:#16a34a}
.st-pending,.st-awaiting_payment,.st-result_submitted,.st-submitted{background:rgba(255,214,10,.2);color:#a16207}
.st-taken,.st-in_progress{background:rgba(91,140,255,.18);color:#2563eb}
.st-disputed,.st-rejected,.st-cancelled{background:rgba(239,68,68,.15);color:#dc2626}
.st-closed{background:rgba(139,139,152,.15);color:var(--t2)}
[data-theme="dark"] .st-open,[data-theme="dark"] .st-active,[data-theme="dark"] .st-completed,[data-theme="dark"] .st-paid_out,[data-theme="dark"] .st-approved,[data-theme="dark"] .st-done{color:#86efac}
[data-theme="dark"] .st-pending,[data-theme="dark"] .st-awaiting_payment,[data-theme="dark"] .st-result_submitted,[data-theme="dark"] .st-submitted{color:#ffe94d}
[data-theme="dark"] .st-taken,[data-theme="dark"] .st-in_progress{color:#93b0ff}
[data-theme="dark"] .st-disputed,[data-theme="dark"] .st-rejected,[data-theme="dark"] .st-cancelled{color:#fca5a5}
.fil{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fil::-webkit-scrollbar{display:none}
.fil select,.fil input{margin:0;flex:0 0 130px;padding:10px 12px;font-size:13px}
.fil button{flex:0 0 auto;padding:10px 16px;min-height:40px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--c2),var(--c));border:1px solid var(--b);border-radius:18px;padding:22px;margin-bottom:12px;box-shadow:var(--sh)}
.bal{font-size:34px;font-weight:800;letter-spacing:-1px}
.bal span{color:var(--t2);font-size:22px}
.wacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.wacts button{min-height:50px}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--c2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 12px;text-align:center;cursor:pointer;border-radius:9px;color:var(--t2);font-size:12px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--c);color:var(--t);box-shadow:var(--sh)}
.msgs{max-height:55vh;overflow-y:auto;margin-bottom:10px;padding:8px;background:var(--bg);border-radius:12px;border:1px solid var(--b)}
.msg{padding:9px 12px;background:var(--c2);border-radius:12px;margin-bottom:6px;max-width:85%;animation:fi .2s}
.msg.mine{background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.2);margin-left:auto}
.msg .who{font-size:10px;font-weight:700;color:var(--a);margin-bottom:3px}
.msg p{font-size:14px;word-break:break-word}
.msg small{color:var(--t3);font-size:9px}
.msg img,.msg video{max-width:100%;border-radius:8px;margin-top:6px;display:block}
.msg audio{width:100%;margin-top:6px}
.file-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);padding:10px 14px;border-radius:8px;margin-top:6px;font-size:13px;color:var(--t);cursor:pointer;border:1px solid var(--b);font-weight:600}
.cform{display:flex;gap:6px;align-items:center}
.cform input[type=text]{margin:0;flex:1}
.cform .icon-btn{background:var(--c2);border:1px solid var(--b);color:var(--t);padding:0;min-height:44px;min-width:44px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
.cform .icon-btn.rec{background:var(--dn);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
th,td{padding:9px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{color:var(--t2);font-size:10px;text-transform:uppercase}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--dn);font-weight:700}
.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.acard{width:100%;max-width:400px;animation:fi .3s}
.alogo{text-align:center;font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:12px}
.alogo img{width:60px;height:60px;border-radius:14px;object-fit:cover}
.alogo span.mkt{color:var(--a)}
.asub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:22px}
.tst{position:fixed;top:14px;left:14px;right:14px;z-index:2000;background:var(--c);color:var(--t);padding:13px 16px;border-radius:12px;border:1px solid var(--b);box-shadow:0 20px 40px rgba(0,0,0,.3);font-size:13px;animation:sd .25s}
@media(min-width:480px){.tst{left:auto;right:20px;max-width:340px}}
.tst.error{border-color:rgba(239,68,68,.5);color:#dc2626}
.tst.success{border-color:rgba(34,197,94,.5);color:#16a34a}
@keyframes sd{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:36px 20px;color:var(--t3);font-size:13px}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--c2);color:var(--t2)}
.bdg.adm{background:var(--a);color:#000}
.bdg.new{background:var(--dn);color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t3);margin-right:5px}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sbox{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:13px;box-shadow:var(--sh)}
.sbox small{color:var(--t2);font-size:11px;display:block;margin-bottom:4px}
.sbox .v{font-size:20px;font-weight:800}
.citem{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.citem.un{border-color:var(--a);background:rgba(255,214,10,.04)}
.citem-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.citem-n{font-weight:700;font-size:14px}
.citem-p{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,214,10,.12);color:var(--a);font-family:ui-monospace,monospace;font-weight:700;font-size:11px}
.idbig{background:linear-gradient(135deg,rgba(255,214,10,.14),rgba(255,140,0,.06));border:1px solid rgba(255,214,10,.3);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.idbig .lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.idbig .val{font-family:ui-monospace,monospace;font-size:30px;font-weight:800;color:var(--a);letter-spacing:4px;line-height:1;margin-bottom:12px}
.stars{color:var(--a);font-size:13px;letter-spacing:1px}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--t2);font-size:14px}
.notif{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.notif.un{border-color:var(--a);background:rgba(255,214,10,.05)}
.notif-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.notif-t{font-weight:700;font-size:14px}
.notif-b{font-size:13px;color:var(--t2);line-height:1.5}
.notif-date{font-size:10px;color:var(--t3);margin-top:6px}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--a);flex-shrink:0}
.notif-count{background:var(--dn);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.agree-box{background:var(--c2);border:1px solid var(--b);border-radius:10px;padding:12px;max-height:160px;overflow-y:auto;font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:10px;white-space:pre-wrap}
.agree-check{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:13px;color:var(--t2);cursor:pointer;padding:8px 0;user-select:none}
.agree-check input[type=checkbox]{width:24px;height:24px;min-width:24px;margin:0;-webkit-appearance:checkbox;appearance:checkbox;cursor:pointer;flex-shrink:0}
.agree-check span{pointer-events:none;flex:1}
.attach-preview{background:var(--c2);border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.attach-preview button{min-height:auto;padding:4px 10px;font-size:11px}
.rec-bar{background:var(--dn);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.theme-btn{background:var(--c2);border:1px solid var(--b);color:var(--t);padding:0;min-height:32px;min-width:32px;border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center}
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.profile-av{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--a),#ff8a00);color:#000;font-weight:900;font-size:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;position:relative}
.profile-av .edit-overlay{position:absolute;bottom:0;right:0;background:var(--a);color:#000;width:26px;height:26px;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--c)}
.profile-name{font-size:20px;font-weight:800;margin-bottom:4px}
.review{background:var(--c2);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--a)}
.review-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.review-name{font-weight:700;font-size:13px}
.review-t{font-size:13px;color:var(--t2);line-height:1.5}
.review-date{font-size:10px;color:var(--t3);margin-top:4px}
.update-banner{background:linear-gradient(135deg,rgba(91,140,255,.2),rgba(91,140,255,.08));border:1px solid rgba(91,140,255,.4);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.update-banner .txt{font-size:13px;color:#2563eb;font-weight:600}
[data-theme="dark"] .update-banner .txt{color:#93b0ff}
.tg-row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--t2);margin-bottom:8px}
.tg-row b{color:var(--t)}
.tg-row .tgid{font-family:ui-monospace,monospace;color:var(--a);font-weight:700}
.support-fab{position:fixed;bottom:24px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--c);border:2px solid var(--a);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:500;text-decoration:none;animation:fi .3s;overflow:hidden}
.support-fab:active{transform:scale(.92)}
.support-fab img{width:100%;height:100%;object-fit:cover}
.typing-ind{color:var(--a);font-size:12px;font-style:italic}
</style>
</head>

function notify(userId,type,title,body,link,fromId){
  if(!userId)return;
  var fromUser=fromId?D.users[fromId]:null;
  var fromName=fromUser?(fromUser.fullName||'Пользователь'):'';
  if(type==='msg'&&fromName)title='Новое сообщение от '+fromName;
  if(type==='resp'&&fromName)title='Новый отклик от '+fromName;
  if(type==='chosen'&&fromName)title='Вас выбрал '+fromName;
  var ref=DB.child('notifs/'+userId);
  ref.once('value').then(function(s){
    var arr=s.val()||{};
    var existing=null;
    var count=1;
    var keys=Object.keys(arr);
    for(var i=0;i<keys.length;i++){
      var n=arr[keys[i]];
      if(n.read)continue;
      if(n.type!==type)continue;
      if(fromId&&n.fromId&&n.fromId!==fromId)continue;
      if(!fromId&&n.fromId)continue;
      if(!fromId&&!n.fromId&&n.title!==title)continue;
      existing={id:keys[i],data:n};
      count=(n.count||1)+1;
      break;
    }
    var id=existing?existing.id:uid();
    ref.child(id).update({id:id,type:type,title:title,body:body,link:link||null,read:false,createdAt:Date.now(),fromId:fromId||null,count:count});
  });
  var u=D.users[userId];
  if(u&&u.tgId&&D.settings&&D.settings.tgToken){
    var tgText='🔔 '+title+'\n\n'+body+'\n\n— Ghost Market';
    fetch('https://api.telegram.org/bot'+D.settings.tgToken+'/sendMessage?chat_id='+encodeURIComponent(u.tgId)+'&text='+encodeURIComponent(tgText)).catch(function(){});
  }
}

function hold(userId,oid,amt){var u=D.users[userId];if(!u)return{ok:false,error:'Нет юзера'};if(unl(u)){var t=uid();DB.child('txs/'+t).set({id:t,userId:userId,orderId:oid,type:'hold',amount:-amt,balanceAfter:0,createdAt:Date.now()});return{ok:true}}if((u.balance||0)<amt)return{ok:false,error:'Недостаточно средств'};var nb=(u.balance||0)-amt;DB.child('users/'+userId).update({balance:nb,heldBalance:(u.heldBalance||0)+amt});var t=uid();DB.child('txs/'+t).set({id:t,userId:userId,orderId:oid,type:'hold',amount:-amt,balanceAfter:nb,createdAt:Date.now()});return{ok:true}}
function payout(orderId){var o=D.orders[orderId];if(!o||!o.executorId)return;var c=D.users[o.customerId],e=D.users[o.executorId];if(!c||!e)return;var pay=+(o.price*(1-o.commissionRate)).toFixed(2),com=+(o.price*o.commissionRate).toFixed(2);if(!unl(c))DB.child('users/'+c.id+'/heldBalance').set(Math.max(0,(c.heldBalance||0)-o.price));if(!unl(e))DB.child('users/'+e.id).update({balance:(e.balance||0)+pay,totalEarned:(e.totalEarned||0)+pay});var t1=uid();DB.child('txs/'+t1).set({id:t1,userId:e.id,orderId:orderId,type:'payout',amount:pay,createdAt:Date.now()});var t2=uid();DB.child('txs/'+t2).set({id:t2,userId:c.id,orderId:orderId,type:'commission',amount:-com,createdAt:Date.now()});notify(e.id,'payout','Заказ выполнен','Зачислено '+money(pay),'wallet')}
function refund(orderId){var o=D.orders[orderId];if(!o)return;var u=D.users[o.customerId];if(!u||unl(u))return;var nb=(u.balance||0)+o.price;DB.child('users/'+u.id).update({balance:nb,heldBalance:Math.max(0,(u.heldBalance||0)-o.price)});var t=uid();DB.child('txs/'+t).set({id:t,userId:u.id,orderId:orderId,type:'refund',amount:o.price,balanceAfter:nb,createdAt:Date.now()});notify(u.id,'refund','Возврат','Возвращено '+money(o.price),'wallet')}

function renderMsg(m){
  var s=D.users[m.senderId]||{};
  var body='<div class="who">'+esc(s.fullName||'—')+'</div>';
  if(m.body)body+='<p>'+esc(m.body)+'</p>';
  if(m.attachment){var at=m.attachment;
    if(at.type==='image')body+='<img src="'+at.data+'">';
    else if(at.type==='voice')body+='<audio controls src="'+at.data+'"></audio>';
    else if(at.type==='circle')body+='<video controls src="'+at.data+'" playsinline></video>';
    else body+='<div class="file-btn" onclick="openFile(\''+m.id+'\',\''+m.chatId+'\')">📄 '+esc(at.name)+' · '+fmtSize(at.size||0)+'</div>';
  }
  body+='<small>'+dt(m.createdAt)+'</small>';
  return'<div class="msg '+(m.senderId===SID?'mine':'')+'">'+body+'</div>';
}
window.openFile=function(msgId,chatId){
  var m=D.msgs[chatId]&&D.msgs[chatId][msgId];
  if(!m||!m.attachment){toast('Файл не найден','error');return}
  try{
    var data=m.attachment.data;
    var byteStr=atob(data.split(',')[1]);
    var ab=new ArrayBuffer(byteStr.length);
    var ia=new Uint8Array(ab);
    for(var i=0;i<byteStr.length;i++)ia[i]=byteStr.charCodeAt(i);
    var blob=new Blob([ab],{type:m.attachment.type==='pdf'?'application/pdf':'application/octet-stream'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=m.attachment.name||'file';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
  }catch(e){toast('Ошибка открытия','error')}
};

window.doLogin=function(e){e.preventDefault();var fd=new FormData(e.target);auth.signInWithEmailAndPassword(fd.get('email').trim().toLowerCase(),fd.get('password')).then(function(cred){if(!cred.user.emailVerified){route={name:'verify',params:{}};render()}else toast('Добро пожаловать','success')}).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'})};
window.doReg=function(e){e.preventDefault();var fd=new FormData(e.target);var email=fd.get('email').trim().toLowerCase();var pw=fd.get('password');var name=fd.get('fullName').trim();if(!fd.get('agree')){document.getElementById('aerr').innerHTML='<div class="err">Нужно принять соглашение</div>';return}if(pw.length<6){document.getElementById('aerr').innerHTML='<div class="err">Пароль короткий</div>';return}auth.createUserWithEmailAndPassword(email,pw).then(function(cred){var uid_=cred.user.uid;var pid=genPid();var isAdmin=(email===ADMIN_EMAIL);var user={id:uid_,publicId:pid,email:email,fullName:name,role:isAdmin?'admin':'user',balance:0,heldBalance:0,totalEarned:0,blocked:false,isUnlimited:isAdmin,ip:'—',deviceId:fp(),lastSeen:Date.now(),rating:0,ratingCount:0,emailVerified:false,isNew:!isAdmin,createdAt:Date.now(),agreedAt:Date.now(),tgId:''};DB.child('users/'+uid_).set(user).then(function(){cred.user.sendEmailVerification().then(function(){toast('Письмо отправлено','success');route={name:'verify',params:{}};render()}).catch(function(err){alert('Ошибка: '+err.message);route={name:'verify',params:{}};render()})})}).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'})};
window.checkVerify=function(){if(!FU){nav('login');return}FU.reload().then(function(){if(FU.emailVerified){DB.child('users/'+FU.uid+'/emailVerified').set(true);toast('Подтверждено!','success');route={name:'home',params:{}};render()}else alert('Почта ещё не подтверждена.')})};
window.resendVerify=function(){if(!FU)return;FU.sendEmailVerification().then(function(){alert('Отправлено на '+FU.email)}).catch(function(err){alert('Ошибка: '+err.message)})};
window.logout=function(){auth.signOut().then(function(){SID=null;FU=null;localStorage.removeItem('gm_sid');route={name:'login',params:{}};render()})};
window.readNotif=function(id){if(!SID)return;var n=D.notifs[SID]&&D.notifs[SID][id];if(!n)return;DB.child('notifs/'+SID+'/'+id).update({read:true,count:0});if(n.link)nav(n.link);else render()};
window.typingStart=function(chatId){if(!SID)return;var c=D.chats[chatId]||{};var f=c.customerId===SID?'custTyping':'exTyping';if(typingTimer)clearTimeout(typingTimer);DB.child('chats/'+chatId+'/'+f).set(Date.now());typingTimer=setTimeout(function(){DB.child('chats/'+chatId+'/'+f).set(0)},5000)};
window.doCreate=function(e){e.preventDefault();var fd=new FormData(e.target);var u=me();if(!u)return;var price=Number(fd.get('price'));if(price>MAX_PRICE){document.getElementById('cerr').innerHTML='<div class="err">Максимум '+MAX_PRICE+' ₽</div>';return}var id=uid();DB.child('orders/'+id).set({id:id,customerId:u.id,executorId:null,title:fd.get('title').trim(),category:fd.get('category'),description:fd.get('description').trim(),price:price,commissionRate:(D.settings&&D.settings.commissionRate)||0.1,status:'open',resultText:null,createdAt:Date.now(),updatedAt:Date.now()}).then(function(){toast('Создано','success');nav('order',{id:id})})};
window.doRespond=function(orderId){var u=me();if(!u)return;var o=D.orders[orderId];if(!o)return;var msg=document.getElementById('resp-msg').value.trim();var price=Number(document.getElementById('resp-price').value)||o.price;if(!msg){toast('Напишите','error');return}if(o.customerId===u.id){toast('Ваша заявка','error');return}var chatId=uid();DB.child('chats/'+chatId).set({id:chatId,orderId:orderId,customerId:o.customerId,executorId:u.id,lastAt:Date.now(),lastMsg:msg.slice(0,60),respPrice:price}).then(function(){var mid=uid();DB.child('msgs/'+chatId+'/'+mid).set({id:mid,chatId:chatId,senderId:u.id,body:msg,createdAt:Date.now()});notify(o.customerId,'resp','Новый отклик',u.fullName+' откликнулся на «'+o.title+'»','myorders',u.id);toast('Отправлено','success');render()})};
window.chooseExec=function(orderId,execId){var u=me();if(!u)return;var o=D.orders[orderId];if(!o||o.customerId!==u.id)return;if(!confirm('Выбрать исполнителя?'))return;DB.child('orders/'+orderId).update({executorId:execId,status:'taken',updatedAt:Date.now()}).then(function(){notify(execId,'chosen','Вас выбрали','По заявке «'+o.title+'»','myorders',u.id);toast('Выбран','success');render()})};
window.submitResult=function(orderId){var u=me();if(!u)return;var o=D.orders[orderId];if(!o||o.executorId!==u.id)return;var t=document.getElementById('res-t').value.trim();if(!t){toast('Введите результат','error');return}DB.child('orders/'+orderId).update({resultText:t,status:'submitted',updatedAt:Date.now()}).then(function(){notify(o.customerId,'result','Результат','Проверьте работу','myorders',u.id);toast('Отправлено','success');render()})};
window.confirmDone=function(orderId){if(!confirm('Подтвердить и выплатить?'))return;var o=D.orders[orderId];if(!o)return;payout(orderId);DB.child('orders/'+orderId).update({status:'done',updatedAt:Date.now()}).then(function(){toast('Выплачено','success');render()})};
window.cancelOrder=function(orderId){if(!confirm('Отменить?'))return;var o=D.orders[orderId];if(!o)return;if(o.status==='taken'||o.status==='submitted')refund(orderId);DB.child('orders/'+orderId).update({status:'cancelled',updatedAt:Date.now()}).then(function(){toast('Отменено');render()})};
window.doDispute=function(orderId){var r=document.getElementById('disp-r').value.trim();if(r.length<5){toast('Опишите','error');return}var id=uid();DB.child('disps/'+id).set({id:id,orderId:orderId,initiatorId:SID,reason:r,status:'open',createdAt:Date.now()}).then(function(){DB.child('orders/'+orderId+'/status').set('disputed');toast('Спор открыт');render()})};
window.openChat=function(orderId,execId,custId){var exist=Object.keys(D.chats).map(function(k){return D.chats[k]}).find(function(c){return c.orderId===orderId&&c.executorId===execId});if(exist){nav('chat',{id:exist.id});return}var id=uid();DB.child('chats/'+id).set({id:id,orderId:orderId,customerId:custId,executorId:execId,lastAt:Date.now(),lastMsg:'Чат создан'}).then(function(){nav('chat',{id:id})})};
window.sendMsg=function(e,chatId){e.preventDefault();var inp=document.getElementById('cinp');var body=inp.value.trim();if(!body&&!pendingFile)return;var msg={id:uid(),chatId:chatId,senderId:SID,body:body||'',createdAt:Date.now()};if(pendingFile)msg.attachment=pendingFile;DB.child('msgs/'+chatId+'/'+msg.id).set(msg).then(function(){var c=D.chats[chatId]||{};var upd={lastAt:Date.now(),lastMsg:(body||(pendingFile?'📎 Файл':'')).slice(0,60)};if(c.customerId===SID)upd.eU=true;else upd.cU=true;DB.child('chats/'+chatId).update(upd);var other=c.customerId===SID?c.executorId:c.customerId;notify(other,'msg','Новое сообщение',body||'📎 Файл',null,SID);inp.value='';pendingFile=null;var s=document.getElementById('attach-slot');if(s)s.innerHTML=''})};
window.pickFile=function(){document.getElementById('file-input').click()};
window.onFilePicked=function(e){var f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Файл >2 МБ','error');return}var r=new FileReader();r.onload=function(){pendingFile={type:f.type.indexOf('image')===0?'image':(f.type==='application/pdf'?'pdf':'file'),name:f.name,size:f.size,data:r.result};var s=document.getElementById('attach-slot');s.innerHTML='<div class="attach-preview"><span>📎 '+esc(f.name)+' · '+fmtSize(f.size)+'</span><button type="button" class="dgr" onclick="cancelAttach()">×</button></div>'};r.readAsDataURL(f);e.target.value=''};
window.cancelAttach=function(){pendingFile=null;var s=document.getElementById('attach-slot');if(s)s.innerHTML=''};
window.toggleVoice=function(){var btn=document.getElementById('voice-btn');if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Микрофон недоступен');return}navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){mediaChunks=[];mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=function(e){if(e.data.size>0)mediaChunks.push(e.data)};mediaRec.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});var blob=new Blob(mediaChunks,{type:'audio/webm'});if(blob.size>1024*1024){toast('Слишком длинное','error');clearRec();return}var r=new FileReader();r.onload=function(){pendingFile={type:'voice',name:'Голосовое',size:blob.size,data:r.result};var s=document.getElementById('attach-slot');s.innerHTML='<div class="attach-preview"><span>🎤 Голосовое · '+fmtSize(blob.size)+'</span><button type="button" class="dgr" onclick="cancelAttach()">×</button></div>';clearRec()};r.readAsDataURL(blob)};mediaRec.start();btn.classList.add('rec');btn.textContent='■';recStart=Date.now();recTimer=setInterval(function(){var sec=Math.floor((Date.now()-recStart)/1000);var s=document.getElementById('rec-slot');s.innerHTML='<div class="rec-bar"><span>🔴 '+sec+' сек</span><button type="button" class="sm dgr" onclick="toggleVoice()">Стоп</button></div>';if(sec>=30)toggleVoice()},500)}).catch(function(err){alert('Нет доступа: '+err.message)})};
function clearRec(){var b=document.getElementById('voice-btn');if(b){b.classList.remove('rec');b.textContent='🎤'}var s=document.getElementById('rec-slot');if(s)s.innerHTML='';if(recTimer){clearInterval(recTimer);recTimer=null}}
window.doDep=function(){var u=me();if(!u)return;var amt=Number(document.getElementById('dep-a').value);var cmt=document.getElementById('dep-c').value.trim();if(!amt||amt<10){toast('Минимум 10 ₽','error');return}var id=uid();DB.child('deps/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,comment:cmt,status:'pending',createdAt:Date.now()}).then(function(){toast('Заявка отправлена');nav('wallet',{tab:'dep'})})};
window.doWd=function(){var u=me();if(!u)return;var amt=Number(document.getElementById('wd-a').value);var svc=document.getElementById('wd-s').value;var dst=document.getElementById('wd-d').value.trim();var mw=(D.settings&&D.settings.minWithdraw)||300;if(!amt||amt<mw){toast('Минимум '+money(mw),'error');return}if(amt>(u.balance||0)){toast('Недостаточно','error');return}if(dst.length<5){toast('Укажите реквизиты','error');return}var id=uid();DB.child('users/'+SID).update({balance:(u.balance||0)-amt}).then(function(){DB.child('wds/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,service:svc,dest:dst,status:'pending',createdAt:Date.now()});var t=uid();DB.child('txs/'+t).set({id:t,userId:SID,type:'withdrawal',amount:-amt,balanceAfter:(u.balance||0)-amt,createdAt:Date.now()});toast('Заявка создана');nav('wallet',{tab:'wd'})})};
window.adminCredit=function(){var pid=document.getElementById('mc-i').value.trim();var amt=Number(document.getElementById('mc-a').value);var el=document.getElementById('mcr');if(!pid){el.innerHTML='<div class="err">Введите ID</div>';return}if(!amt||amt<=0){el.innerHTML='<div class="err">Введите сумму</div>';return}var res=uByPid(pid);if(!res){el.innerHTML='<div class="err">ID не найден</div>';return}var userId=res[0],uu=res[1];var nb=(uu.balance||0)+amt;DB.child('users/'+userId+'/balance').set(nb).then(function(){var t=uid();DB.child('txs/'+t).set({id:t,userId:userId,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});notify(userId,'credit','Баланс пополнен','Зачислено '+money(amt),'wallet');el.innerHTML='<div class="suc">✓ Зачислено '+money(amt)+' для <b>'+esc(uu.fullName)+'</b></div>';document.getElementById('mc-i').value=''})};
window.adminQuick=function(pid){var res=uByPid(String(pid));if(!res){toast('Не найден','error');return}var id=res[0],uu=res[1];var s=prompt('Зачислить '+uu.fullName+'\nБаланс: '+money(uu.balance||0)+'\n\nСумма:','300');if(s===null)return;var amt=Number(s);if(!amt||amt<=0)return;var nb=(uu.balance||0)+amt;DB.child('users/'+id+'/balance').set(nb).then(function(){var t=uid();DB.child('txs/'+t).set({id:t,userId:id,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});notify(id,'credit','Баланс пополнен','Зачислено '+money(amt),'wallet');toast('Зачислено','success');render()})};
window.adminDep=function(id,act){var d=D.deps[id];if(!d||d.status!=='pending')return;if(act==='ok'){var uu=D.users[d.userId];if(!uu)return;var nb=(uu.balance||0)+d.amount;DB.child('users/'+d.userId+'/balance').set(nb).then(function(){var t=uid();DB.child('txs/'+t).set({id:t,userId:d.userId,type:'deposit',amount:d.amount,balanceAfter:nb,createdAt:Date.now()});DB.child('deps/'+id+'/status').set('approved');notify(d.userId,'dep','Пополнение','Зачислено '+money(d.amount),'wallet');toast('Зачислено');render()})}else{DB.child('deps/'+id+'/status').set('rejected').then(function(){toast('Отклонено');render()})}};
window.adminWd=function(id,act){var w=D.wds[id];if(!w||w.status!=='pending')return;if(act==='ok'){DB.child('wds/'+id+'/status').set('completed').then(function(){notify(w.userId,'wd','Вывод выполнен','Заявка на '+money(w.amount),'wallet');toast('Готово');render()})}else{var uu=D.users[w.userId];if(uu){var nb=(uu.balance||0)+w.amount;DB.child('users/'+w.userId+'/balance').set(nb);var t=uid();DB.child('txs/'+t).set({id:t,userId:w.userId,type:'refund',amount:w.amount,balanceAfter:nb,createdAt:Date.now()})}DB.child('wds/'+id+'/status').set('rejected').then(function(){toast('Возвращено');render()})}};
window.adminDisp=function(id,res){var d=D.disps[id];if(!d||d.status!=='open')return;var o=D.orders[d.orderId];if(!o)return;if(res==='refund'){refund(d.orderId);DB.child('orders/'+d.orderId+'/status').set('cancelled')}else{payout(d.orderId);DB.child('orders/'+d.orderId+'/status').set('done')}DB.child('disps/'+id).update({status:'resolved',resolution:res}).then(function(){toast('Решён');render()})};
window.adminBlock=function(id){var uu=D.users[id];if(!uu)return;DB.child('users/'+id+'/blocked').set(!uu.blocked).then(function(){toast(uu.blocked?'Разблокирован':'Заблокирован','success');render()})};
window.adminDelOrder=function(orderId){var o=D.orders[orderId];if(!o){toast('Не найдено','error');return}if(!confirm('Удалить заявку «'+o.title+'»?'))return;DB.child('orders/'+orderId).remove().then(function(){toast('Удалено','success');render()})};
window.adminTestTg=function(userId){var uu=D.users[userId];if(!uu||!uu.tgId){toast('Нет Telegram ID','error');return}if(!D.settings||!D.settings.tgToken){toast('Токен не настроен','error');return}fetch('https://api.telegram.org/bot'+D.settings.tgToken+'/sendMessage?chat_id='+encodeURIComponent(uu.tgId)+'&text='+encodeURIComponent('🔔 Тест от Ghost Market\n\nЕсли видите — всё работает!')).then(function(r){return r.json()}).then(function(d){if(d.ok)toast('Отправлено ✓','success');else toast('Ошибка: '+(d.description||''),'error')}).catch(function(){toast('Ошибка сети','error')})};
window.adminSave=function(){var upd={cardNumber:document.getElementById('s-card').value.trim(),cardHolder:document.getElementById('s-holder').value.trim(),bankName:document.getElementById('s-bank').value.trim(),commissionRate:Number(document.getElementById('s-comm').value)/100,minDeposit:Number(document.getElementById('s-md').value)||100,minWithdraw:Number(document.getElementById('s-mw').value)||300,appVersion:document.getElementById('s-ver').value.trim()||'1.0.0',tgToken:document.getElementById('s-tg').value.trim()};DB.child('settings').update(upd).then(function(){toast('Сохранено','success')})};
window.applyF=function(){var cat=document.getElementById('f-c').value;var mn=document.getElementById('f-mn').value;var mx=document.getElementById('f-mx').value;nav('home',{cat:cat||null,mn:mn||null,mx:mx||null})};

render();
</script>
</body>
</html>
