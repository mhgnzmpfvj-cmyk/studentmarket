<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0a0a0f" />
<title>StudentMarket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--card:#16161f;--card2:#1e1e2a;--border:#26262f;--text:#ededf2;--text2:#8b8b98;--text3:#5c5c68;--accent:#ffd60a;--success:#22c55e;--danger:#ef4444;--info:#5b8cff}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
a{color:var(--info);cursor:pointer;text-decoration:none}
input,textarea,select{width:100%;padding:14px 16px;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
button{background:var(--accent);color:#000;border:0;padding:14px 20px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:48px;transition:opacity .15s}
button:active{opacity:.75}button:disabled{opacity:.35}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
button.danger{background:var(--danger);color:#fff}
button.success{background:var(--success);color:#fff}
button.small{padding:9px 14px;font-size:13px;min-height:38px;border-radius:10px}
button.full{width:100%}
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);flex-wrap:wrap;justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff8a00);color:#000;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--text2);font-size:14px;font-weight:500;padding:8px 12px;border-radius:10px;white-space:nowrap}
nav a.active{background:var(--card2);color:var(--text)}
.container{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px}
h2{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:-.3px}
h3{font-size:16px;font-weight:700;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-dark{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}
.error-box{background:rgba(239,68,68,.12);color:#fca5a5;padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px;border:1px solid rgba(239,68,68,.25)}
.success-box{background:rgba(34,197,94,.12);color:#86efac;padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px;border:1px solid rgba(34,197,94,.25)}
.warn-box{background:rgba(255,214,10,.08);color:#ffe94d;padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid rgba(255,214,10,.2);line-height:1.5}
.hint{color:var(--text2);font-size:13px;margin-top:6px;line-height:1.5}
.sync-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(34,197,94,.12);color:#86efac}
.sync-badge.off{background:rgba(139,139,152,.15);color:var(--text2)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.order-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 16px;cursor:pointer;transition:border-color .15s,transform .1s}
.order-card:active{border-color:var(--accent);transform:scale(.99)}
.order-card .subject{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.order-card h3{font-size:15px;margin:6px 0;color:var(--text);font-weight:700}
.order-card p{color:var(--text2);font-size:13px;margin-bottom:10px;line-height:1.5}
.order-card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:800;font-size:18px;color:var(--accent);white-space:nowrap;letter-spacing:-.3px}
.status{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(91,140,255,.15);color:var(--info);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.status-created{background:rgba(139,139,152,.15);color:var(--text2)}
.status-awaiting_payment{background:rgba(255,214,10,.15);color:#ffe94d}
.status-paid_out{background:rgba(34,197,94,.15);color:#86efac}
.status-disputed{background:rgba(239,68,68,.15);color:#fca5a5}
.status-cancelled,.status-refunded{background:rgba(139,139,152,.15);color:var(--text2)}
.status-result_submitted{background:rgba(255,214,10,.15);color:#ffe94d}
.status-in_progress{background:rgba(91,140,255,.18);color:#93b0ff}
.status-pending{background:rgba(255,214,10,.15);color:#ffe94d}
.status-approved,.status-completed{background:rgba(34,197,94,.15);color:#86efac}
.status-rejected{background:rgba(239,68,68,.15);color:#fca5a5}
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters input,.filters select{margin:0;flex:0 0 150px;padding:10px 12px;font-size:14px}
.filters button{flex:0 0 auto;padding:10px 16px;min-height:40px;font-size:14px}
.balance-hero{background:linear-gradient(135deg,#1e1e2a 0%,#16161f 100%);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:12px;position:relative;overflow:hidden}
.balance-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,214,10,.15) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.balance-label{color:var(--text2);font-size:13px;font-weight:500;margin-bottom:6px}
.balance-amount{font-size:36px;font-weight:800;letter-spacing:-1px;color:var(--text)}
.balance-amount span{color:var(--text2);font-size:24px;font-weight:600}
.balance-sub{display:flex;gap:20px;margin-top:16px}
.balance-sub-item{font-size:12px;color:var(--text2)}
.balance-sub-item b{display:block;color:var(--text);font-size:15px;font-weight:700;margin-top:2px}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.wallet-actions button{min-height:56px;font-size:15px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 14px;text-align:center;cursor:pointer;border-radius:9px;color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text)}
.messages{max-height:380px;overflow-y:auto;margin-bottom:12px;padding:8px;background:var(--bg);border-radius:12px;border:1px solid var(--border)}
.msg{padding:10px 13px;background:var(--card2);border-radius:12px;margin-bottom:6px;max-width:85%}
.msg.mine{background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.2);margin-left:auto}
.msg .sender{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.msg p{font-size:14px;margin:3px 0;word-break:break-word}
.msg small{color:var(--text3);font-size:10px}
.chat-form{display:flex;gap:8px}.chat-form input{margin:0}
.steps{display:flex;margin-bottom:16px;padding:12px 8px;background:var(--card2);border-radius:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;text-align:center;font-size:10px;color:var(--text3);padding:3px 8px;position:relative;white-space:nowrap;min-width:80px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.step.done{color:var(--success)}.step.current{color:var(--accent)}
.step:not(:last-child)::after{content:'';position:absolute;right:-3px;top:50%;width:6px;height:1px;background:var(--border)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.pos{color:var(--success);font-weight:700}.neg{color:var(--danger);font-weight:700}
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{width:100%;max-width:380px}
.auth-logo{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.auth-logo span{color:var(--accent)}
.auth-sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:28px}
.toast{position:fixed;top:16px;left:16px;right:16px;z-index:1000;background:var(--card);color:var(--text);padding:14px 18px;border-radius:12px;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.5);font-size:14px;font-weight:500;animation:slideDown .2s ease}
@media(min-width:480px){.toast{left:auto;right:20px;max-width:360px}}
.toast.error{border-color:rgba(239,68,68,.4);color:#fca5a5}
.toast.success{border-color:rgba(34,197,94,.4);color:#86efac}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--card2);color:var(--text2);letter-spacing:.3px}
.badge.admin{background:var(--accent);color:#000}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text3);margin-right:5px}
.online-dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}
.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat-card small{color:var(--text2);font-size:12px;display:block;margin-bottom:6px;font-weight:500}
.stat-card .value{font-size:22px;font-weight:800;letter-spacing:-.5px}
.proposal{padding:13px 15px;background:var(--card2);border-radius:12px;margin-bottom:10px;border-left:3px solid var(--accent)}
.proposal b{color:var(--text)}
.row-buttons{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.result pre{background:var(--bg);padding:14px;border-radius:10px;white-space:pre-wrap;font-size:13px;margin-top:8px;font-family:ui-monospace,"SF Mono",monospace;word-break:break-word;color:var(--text);border:1px solid var(--border)}
.divider{height:1px;background:var(--border);margin:16px 0}
.pay-card-box{background:linear-gradient(135deg,#2a2a3a 0%,#1a1a24 100%);border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid var(--border);position:relative;overflow:hidden}
.pay-card-box::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,214,10,.12) 0%,transparent 70%);border-radius:50%}
.pay-card-num{font-family:ui-monospace,"SF Mono",monospace;font-size:18px;font-weight:700;letter-spacing:2px;color:var(--text);margin-bottom:12px;word-break:break-all;line-height:1.4}
.pay-card-label{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:8px}
.copy-btn{background:var(--accent);color:#000;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:5px;min-height:auto}
.id-display{background:linear-gradient(135deg,rgba(255,214,10,.14),rgba(255,140,0,.06));border:1px solid rgba(255,214,10,.3);border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.id-label{color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;font-weight:600}
.id-value{font-family:ui-monospace,"SF Mono",monospace;font-size:32px;font-weight:800;color:var(--accent);letter-spacing:4px;margin-bottom:12px;line-height:1;word-break:break-all}
.id-pill{display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(255,214,10,.12);color:var(--accent);font-family:ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.5px}
.user-row{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.user-row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.user-row-name{font-weight:700;font-size:15px}
.user-row-meta{font-size:12px;color:var(--text2);line-height:1.7}
.user-row-meta b{color:var(--text)}
.user-row-meta code{background:var(--bg);padding:2px 6px;border-radius:5px;font-family:ui-monospace,monospace;font-size:11px;color:var(--text)}
.user-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px}
.as-banner{background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#93b0ff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.as-banner button{background:var(--info);color:#fff;padding:6px 12px;font-size:12px;min-height:auto;border-radius:8px}
@media(max-width:480px){.balance-amount{font-size:32px}h1{font-size:22px}.container{padding:12px 12px 40px}.id-value{font-size:26px;letter-spacing:3px}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
// ============================================================
// 1. FIREBASE CONFIG — ВСТАВЬ СЮДА СВОЙ КОНФИГ ИЗ FIREBASE
// ============================================================
// Пример (замени на свои значения):
const firebaseConfig = {
  apiKey: "ВСТАВЬ_СЮДА",
  authDomain: "ВСТАВЬ_СЮДА.firebaseapp.com",
  databaseURL: "https://ВСТАВЬ_СЮДА-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ВСТАВЬ_СЮДА",
  storageBucket: "ВСТАВЬ_СЮДА.appspot.com",
  messagingSenderId: "ВСТАВЬ_СЮДА",
  appId: "ВСТАВЬ_СЮДА"
};

let firebaseReady=false,firebaseRef=null;
try{
  if(firebaseConfig.apiKey&&firebaseConfig.apiKey!=='ВСТАВЬ_СЮДА'&&typeof firebase!=='undefined'){
    firebase.initializeApp(firebaseConfig);
    firebaseRef=firebase.database().ref('studentmarket');
    firebaseReady=true;
    console.log('✓ Firebase подключён');
  }else{
    console.warn('Firebase не настроен — работаем локально');
  }
}catch(e){console.error('Firebase init error:',e)}

// ============================================================
// 2. ЛОКАЛЬНАЯ БАЗА (кэш + офлайн режим)
// ============================================================
const DB_KEY='sm_db_v5';
const CATEGORIES=[
  'Домашнее задание','Реферат','Курсовая работа','Презентация',
  'Контрольная работа','Эссе / сочинение',
  'Покупка и доставка (еда, напитки, в колледж)','Другое'
];
const CATEGORY_HINTS={
  'Домашнее задание':'Задачи, упражнения, параграфы',
  'Реферат':'Обзор темы, список литературы, оформление',
  'Курсовая работа':'Полный текст с планом, введением и заключением',
  'Презентация':'Слайды с текстом и картинками',
  'Контрольная работа':'Решение варианта, ответы на вопросы',
  'Эссе / сочинение':'Свободная тема, объём 200–500 слов',
  'Покупка и доставка (еда, напитки, в колледж)':'Купить что-то и передать/привезти',
  'Другое':'Опишите в тексте, что нужно сделать'
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function genPublicId(existing){
  let id;const set=(existing||[]).map(String);
  do{id=String(Math.floor(10000000+Math.random()*90000000))}while(set.includes(id));
  return id;
}
function deviceFingerprint(){
  try{
    const s=[navigator.userAgent||'',navigator.language||'',screen.width+'x'+screen.height,new Date().getTimezoneOffset()].join('|');
    let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}
    return 'DEV-'+Math.abs(h).toString(36).toUpperCase();
  }catch{return 'DEV-UNKNOWN'}
}
function defaultDB(){
  return{
    users:[],orders:[],proposals:[],transactions:[],messages:[],disputes:[],
    deposits:[],withdrawals:[],revenues:[],manualCredits:[],reviews:[],
    settings:{cardNumber:'',cardHolder:'',bankName:'',commissionRate:.10,minWithdraw:300,minDeposit:100}
  };
}
let db=defaultDB();
let _lastSaveTime=0;

function loadLocal(){
  try{
    const r=localStorage.getItem(DB_KEY);
    if(r)return JSON.parse(r);
  }catch{}
  return null;
}
function saveLocal(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch{}
}

function loadDB(){
  const local=loadLocal();
  if(local){
    db=Object.assign(defaultDB(),local);
    if(!db.settings)db.settings={cardNumber:'',cardHolder:'',bankName:'',commissionRate:.10,minWithdraw:300,minDeposit:100};
    return;
  }
  // Первый запуск — создаём только админа (синхронизируется через Firebase)
  const a={id:uid(),publicId:genPublicId([]),email:'admin@example.com',password:'password123',
    fullName:'Администратор',role:'admin',balance:0,heldBalance:0,totalEarned:0,blocked:false,
    isUnlimited:true,ip:'—',deviceId:'—',lastSeen:Date.now(),rating:0,ratingCount:0,createdAt:Date.now()};
  db.users=[a];
}

function saveDB(){
  _lastSaveTime=Date.now();
  saveLocal();
  if(firebaseReady){
    const toSave=JSON.parse(JSON.stringify(db));
    // Локальные вещи не синхронизируем
    delete toSave._session;
    delete toSave._adminReturn;
    firebaseRef.set(toSave).catch(e=>console.warn('Sync error',e));
  }
}

// Сессия хранится ТОЛЬКО локально, не в Firebase
let session=localStorage.getItem('sm_session');
let adminReturn=localStorage.getItem('sm_adminReturn');
const saveSession=()=>{
  if(session)localStorage.setItem('sm_session',session);else localStorage.removeItem('sm_session');
  if(adminReturn)localStorage.setItem('sm_adminReturn',adminReturn);else localStorage.removeItem('sm_adminReturn');
};

const cu=()=>session?db.users.find(u=>u.id===session):null;
const findBy=(a,id)=>a.find(x=>x.id===id);
const findById=(arr,pid)=>arr.find(u=>String(u.publicId)===String(pid));
const money=n=>Number(n).toFixed(2)+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=ts=>new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const initials=n=>(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const isOnline=u=>u&&u.lastSeen&&(Date.now()-u.lastSeen<5*60*1000);
const STATUS={created:'Открыт',awaiting_payment:'Ожидает оплаты',in_progress:'В работе',
  result_submitted:'Результат отправлен',paid_out:'Выплачено',cancelled:'Отменён',refunded:'Возврат',disputed:'Спор'};
const STEPS=['created','awaiting_payment','in_progress','result_submitted','paid_out'];
function stars(rating,count){
  if(!count)return '<span class="stars" style="color:var(--text3)">нет оценок</span>';
  const full=Math.round(rating);
  return `<span class="stars">${'★'.repeat(full)}${'☆'.repeat(5-full)}</span> <span style="color:var(--text2);font-size:12px">${rating.toFixed(1)} (${count})</span>`;
}

function holdFunds(userId,oid,amt){
  const k='hold-'+oid;if(db.transactions.find(t=>t.idempotencyKey===k))return{ok:true};
  const u=findBy(db.users,userId);if(!u)return{ok:false,error:'Пользователь не найден'};
  if(u.isUnlimited){db.transactions.push({id:uid(),userId,orderId:oid,type:'hold',amount:-amt,balanceAfter:0,idempotencyKey:k,createdAt:Date.now()});return{ok:true}}
  if(u.balance<amt)return{ok:false,error:'Недостаточно средств'};
  u.balance-=amt;u.heldBalance+=amt;
  db.transactions.push({id:uid(),userId,orderId:oid,type:'hold',amount:-amt,balanceAfter:u.balance,idempotencyKey:k,createdAt:Date.now()});
  return{ok:true};
}
function releaseToExecutor(oid){
  const o=findBy(db.orders,oid);if(!o||!o.executorId)return{ok:false,error:'Нет исполнителя'};
  const c=findBy(db.users,o.customerId),e=findBy(db.users,o.executorId);
  const pay=+(o.price*(1-o.commissionRate)).toFixed(2),com=+(o.price*o.commissionRate).toFixed(2);
  if(!c.isUnlimited)c.heldBalance-=o.price;
  if(!e.isUnlimited){e.balance+=pay;e.totalEarned+=pay}
  db.transactions.push({id:uid(),userId:e.id,orderId:oid,type:'payout',amount:pay,balanceAfter:e.balance,createdAt:Date.now()});
  db.transactions.push({id:uid(),userId:c.id,orderId:oid,type:'commission',amount:-com,balanceAfter:c.balance,createdAt:Date.now()});
  db.revenues.push({id:uid(),orderId:oid,amount:com,createdAt:Date.now()});
  return{ok:true};
}
function refundCustomer(oid){
  const o=findBy(db.orders,oid);if(!o)return{ok:false};
  const u=findBy(db.users,o.customerId);
  if(!u.isUnlimited){u.balance+=o.price;u.heldBalance-=o.price}
  db.transactions.push({id:uid(),userId:u.id,orderId:oid,type:'refund',amount:o.price,balanceAfter:u.balance,createdAt:Date.now()});
  return{ok:true};
}
async function recordPresence(){
  const u=cu();if(!u)return;
  const old=u.lastSeen;
  u.lastSeen=Date.now();
  u.deviceId=deviceFingerprint();
  if(!u.ip||u.ip==='—'){
    try{const r=await fetch('https://api.ipify.org?format=json',{cache:'no-store'});const d=await r.json();u.ip=d.ip||'—'}catch{u.ip='—'}
  }
  if(Math.abs(u.lastSeen-old)>30000)saveDB();
}

function pageAdmin({tab}={}){
  const u=cu();if(!u||u.role!=='admin')return`<div class="card"><h2>Доступ запрещён</h2></div>`;
  const t=tab||'stats';
  const deps=db.deposits.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const wds=db.withdrawals.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const disp=db.disputes.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const usrs=db.users.slice().sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  const ords=db.orders.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const rev=db.revenues.reduce((s,r)=>s+r.amount,0);
  const pd=deps.filter(x=>x.status==='pending').length;
  const pw=wds.filter(x=>x.status==='pending').length;
  const pdi=disp.filter(x=>x.status==='open').length;
  const online=usrs.filter(isOnline).length;
  return`<h1>Админ-панель</h1>
    <div class="tabs">
      <div class="tab ${t==='stats'?'active':''}" onclick="nav('admin',{tab:'stats'})">Обзор</div>
      <div class="tab ${t==='credit'?'active':''}" onclick="nav('admin',{tab:'credit'})">💰 Зачислить</div>
      <div class="tab ${t==='deposits'?'active':''}" onclick="nav('admin',{tab:'deposits'})">Пополн.${pd?` (${pd})`:''}</div>
      <div class="tab ${t==='withdrawals'?'active':''}" onclick="nav('admin',{tab:'withdrawals'})">Выводы${pw?` (${pw})`:''}</div>
      <div class="tab ${t==='disputes'?'active':''}" onclick="nav('admin',{tab:'disputes'})">Споры${pdi?` (${pdi})`:''}</div>
      <div class="tab ${t==='users'?'active':''}" onclick="nav('admin',{tab:'users'})">Юзеры${online?` (${online})`:''}</div>
      <div class="tab ${t==='orders'?'active':''}" onclick="nav('admin',{tab:'orders'})">Заказы</div>
      <div class="tab ${t==='settings'?'active':''}" onclick="nav('admin',{tab:'settings'})">Настройки</div>
    </div>

}
function adminTab(t,d){

    <div class="stat-card"><small>Заказов</small><div class="value">${d.ords.length}</div></div>

  </div>
  <div class="card"><h3>Статус синхронизации</h3>
    ${firebaseReady?'<div class="success-box">✓ Данные синхронизируются с сервером Firebase. Все пользователи с любого устройства видят одинаковые данные.</div>':'<div class="warn-box">⚠ Firebase не настроен. Данные хранятся только в этом браузере. Смотри инструкцию.</div>'}

  <div class="card"><h3>Заказы по статусам</h3><div class="table-wrap"><table>
    <thead><tr><th>Статус</th><th>Кол-во</th></tr></thead>

    ${mc.length?`<div class="card"><h3>Последние зачисления</h3><div class="table-wrap"><table>
      <thead><tr><th>Дата</th><th>ID</th><th>Имя</th><th>Сумма</th></tr></thead>
      <tbody>${mc.map(m=>{const u=findBy(db.users,m.userId);return`<tr>
        <td>${dt(m.createdAt)}</td><td><span class="id-pill">${esc(m.publicId)}</span></td>
        <td>${esc(u?.fullName||'—')}</td><td class="pos">+${money(m.amount)}</td>
      </tr>`}).join('')}</tbody></table></div></div>`:''}`;
  }
  if(t==='deposits'){
    if(!d.deps.length)return`<div class="empty"><div class="empty-icon">💳</div>Заявок нет</div>`;
    return d.deps.map(x=>{const u=findBy(db.users,x.userId);return`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div><b>${esc(u?.fullName||'—')}</b> <span class="id-pill">${esc(u?.publicId||'—')}</span><div class="hint">${esc(u?.email||'')}</div></div>
        <span class="status status-${x.status}">${x.status==='pending'?'Ожидает':x.status==='approved'?'Зачислено':'Отклонено'}</span>

      ${x.comment?`<div class="hint" style="margin-top:6px">Комментарий: ${esc(x.comment)}</div>`:''}

      ${x.status==='pending'?`<div class="row-buttons">
        <button class="small success" onclick="handleApproveDeposit('${x.id}')">Зачислить</button>

  if(t==='withdrawals'){
    if(!d.wds.length)return`<div class="empty"><div class="empty-icon">🏦</div>Заявок нет</div>`;
    return d.wds.map(x=>{const u=findBy(db.users,x.userId);return`<div class="card">

      <div style="margin-top:12px"><span class="price">${money(x.amount)}</span></div>
      ${x.service?`<div class="hint" style="margin-top:6px">Способ: <b style="color:var(--text)">${esc(x.service)}</b></div>`:''}

      ${x.status==='pending'?`<div class="row-buttons">
        <button class="small success" onclick="handleCompleteWithdrawal('${x.id}')">✓ Выполнено</button>

    </div>`}).join('');
  }
  if(t==='disputes'){
    if(!d.disp.length)return`<div class="empty"><div class="empty-icon">⚖️</div>Споров нет</div>`;
    return d.disp.map(x=>{
      const o=findBy(db.orders,x.orderId),init=findBy(db.users,x.initiatorId);
      const c=o?findBy(db.users,o.customerId):null,e=o?.executorId?findBy(db.users,o.executorId):null;
      return`<div class="card">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
          <div><b>${esc(o?.title||'—')}</b><div class="hint">${money(o?.price||0)} · ${esc(c?.fullName||'—')} vs ${esc(e?.fullName||'—')}</div></div>
          <span class="status status-${x.status==='open'?'disputed':'paid_out'}">${x.status==='open'?'Открыт':'Решён'}</span>
        </div>
        <div class="warn-box" style="margin-top:10px"><b>От ${esc(init?.fullName||'—')}:</b> ${esc(x.reason)}</div>
        ${x.status==='open'?`<div class="row-buttons">
          <button class="small danger" onclick="handleResolveDispute('${x.id}','refund')">Вернуть заказчику</button>
          <button class="small success" onclick="handleResolveDispute('${x.id}','payout')">Выплатить исполнителю</button>
        </div>`:`<div class="hint" style="margin-top:8px">Решение: ${x.resolution==='refund'?'возврат':'выплата'}</div>`}
      </div>`;
    }).join('');
  }
  if(t==='users'){
    if(!d.usrs.length)return`<div class="empty">Пользователей нет</div>`;
    return d.usrs.map(u=>{
      const bal=u.isUnlimited?'∞':money(u.balance);
      const held=u.isUnlimited?'∞':money(u.heldBalance);
      const online=isOnline(u);
      return`<div class="user-row">
        <div class="user-row-head">
          <div class="user-row-name"><span class="online-dot ${online?'on':''}"></span>${esc(u.fullName)} ${u.role==='admin'?'<span class="badge admin">ADMIN</span>':''}</div>
          <span class="status status-${u.blocked?'rejected':'approved'}">${u.blocked?'Заблок.':online?'Онлайн':'Офлайн'}</span>

          ID: <span class="id-pill">${esc(u.publicId)}</span><br>
          Email: <b>${esc(u.email)}</b><br>
          IP: <code>${esc(u.ip||'—')}</code><br>
          Устройство: <code>${esc(u.deviceId||'—')}</code><br>
          Баланс: <b style="color:var(--accent)">${bal}</b> · В сделках: ${held}<br>
          Рейтинг: ${stars(u.rating,u.ratingCount)}<br>
          Последний вход: ${dt(u.lastSeen||u.createdAt)}
        </div>
        <div class="user-actions">
          <button class="small success" onclick="handleQuickCredit('${esc(u.publicId)}')">💰 Зачислить</button>
          <button class="small secondary" onclick="handleLoginAs('${u.id}')">👁 Войти как</button>
          <button class="small secondary" onclick="copyText('${esc(u.publicId)}')">📋 ID</button>
          <button class="small ${u.blocked?'primary':'danger'}" onclick="handleToggleBlock('${u.id}')">${u.blocked?'Разблок.':'Блок.'}</button>
        </div>
      </div>`;
    }).join('');
  }
  if(t==='orders')return`<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Заголовок</th><th>Цена</th><th>Статус</th></tr></thead>
    <tbody>${d.ords.map(o=>`<tr style="cursor:pointer" onclick="nav('order',{id:'${o.id}'})">
      <td>${esc(o.title)}</td><td>${money(o.price)}</td>
      <td><span class="status status-${o.status}">${STATUS[o.status]}</span></td>
    </tr>`).join('')}</tbody></table></div></div>`;
  if(t==='settings'){const s=db.settings;return`<div class="card">
    <h3>Реквизиты для приёма платежей</h3>
    <label>Номер карты / телефон СБП</label>
    <input id="s-card" value="${esc(s.cardNumber)}" placeholder="2200 7000 0000 0000" />
    <label>Имя получателя</label>
    <input id="s-holder" value="${esc(s.cardHolder)}" placeholder="Иванов Иван" />
    <label>Название банка</label>
    <input id="s-bank" value="${esc(s.bankName)}" placeholder="Т-Банк" />
    <div class="divider"></div>
    <h3>Комиссия</h3>
    <label>Процент комиссии</label>
    <input id="s-comm" type="number" min="0" max="50" step="1" value="${(s.commissionRate*100).toFixed(0)}" />
    <div class="divider"></div>
    <h3>Лимиты</h3>
    <label>Мин. пополнение, ₽</label>
    <input id="s-mindep" type="number" min="10" value="${s.minDeposit}" />
    <label>Мин. вывод, ₽</label>
    <input id="s-minwd" type="number" min="10" value="${s.minWithdraw}" />
    <button class="full" style="margin-top:12px" onclick="handleSaveSettings()">Сохранить</button>

    <button class="secondary full" onclick="handleExportData()">⬇ Скачать копию данных</button>
    <div class="divider"></div>
    <button class="danger full" onclick="handleFullReset()">⚠ Сбросить всё</button>

  return'';
}

window.handleLogin=e=>{e.preventDefault();const fd=new FormData(e.target);
  const em=fd.get('email').trim().toLowerCase(),pw=fd.get('password');
  const u=db.users.find(x=>x.email.toLowerCase()===em);
  if(!u||u.password!==pw)return document.getElementById('auth-error').innerHTML=`<div class="error-box">Неверный email или пароль</div>`;
  if(u.blocked)return document.getElementById('auth-error').innerHTML=`<div class="error-box">Аккаунт заблокирован</div>`;
  session=u.id;adminReturn=null;saveSession();recordPresence();toast('Добро пожаловать','success');nav('home')};
window.handleRegister=e=>{e.preventDefault();const fd=new FormData(e.target);
  const em=fd.get('email').trim().toLowerCase();
  if(db.users.find(x=>x.email.toLowerCase()===em))return document.getElementById('auth-error').innerHTML=`<div class="error-box">Этот email уже занят</div>`;
  const pw=fd.get('password');if(pw.length<6)return document.getElementById('auth-error').innerHTML=`<div class="error-box">Пароль слишком короткий</div>`;
  const pid=genPublicId(db.users.map(u=>u.publicId));
  const u={id:uid(),publicId:pid,email:em,password:pw,fullName:fd.get('fullName').trim(),role:fd.get('role'),
    balance:0,heldBalance:0,totalEarned:0,blocked:false,isUnlimited:false,ip:'—',deviceId:deviceFingerprint(),
    lastSeen:Date.now(),rating:0,ratingCount:0,createdAt:Date.now()};
  db.users.push(u);session=u.id;adminReturn=null;saveSession();saveDB();recordPresence();
  toast('Ваш ID: '+pid,'success');nav('home')};
window.logout=()=>{session=null;adminReturn=null;saveSession();nav('login')};
window.handleLoginAs=userId=>{
  const me=cu();if(!me||me.role!=='admin')return;
  const target=findBy(db.users,userId);if(!target)return toast('Не найден','error');
  adminReturn=me.id;session=target.id;saveSession();
  toast('Вы вошли как '+target.fullName,'success');nav('home');
};
window.handleReturnToAdmin=()=>{
  if(!adminReturn)return;
  const a=findBy(db.users,adminReturn);if(!a)return;
  session=a.id;adminReturn=null;saveSession();toast('Вернулись к админу','success');nav('admin');
};
window.handleCreate=e=>{e.preventDefault();const u=cu();if(!u)return;
  const fd=new FormData(e.target);
  const o={id:uid(),customerId:u.id,executorId:null,title:fd.get('title').trim(),subject:fd.get('subject'),
    description:fd.get('description').trim(),price:Number(fd.get('price')),
    commissionRate:db.settings.commissionRate,status:'created',resultText:null,createdAt:Date.now(),updatedAt:Date.now()};
  db.orders.push(o);saveDB();toast('Заявка создана','success');nav('order',{id:o.id})};
window.handleProposal=oid=>{const u=cu();if(!u)return;
  const msg=document.getElementById('p-msg').value.trim(),price=Number(document.getElementById('p-price').value);
  if(!msg)return toast('Напишите сообщение','error');
  if(db.proposals.find(p=>p.orderId===oid&&p.executorId===u.id))return toast('Вы уже откликнулись','error');
  db.proposals.push({id:uid(),orderId:oid,executorId:u.id,message:msg,price:price||findBy(db.orders,oid).price,status:'pending',createdAt:Date.now()});
  saveDB();toast('Отклик отправлен','success');render()};
window.handleSelectExec=(oid,eid)=>{
  const o=findBy(db.orders,oid);if(!o)return;
  const u=cu();if(!u||u.id!==o.customerId)return;
  o.executorId=eid;o.status='awaiting_payment';o.updatedAt=Date.now();
  db.proposals.filter(p=>p.orderId===oid).forEach(p=>p.status=p.executorId===eid?'accepted':'rejected');
  saveDB();toast('Выбран исполнитель. Оплатите заказ.','success');render();
};
window.handlePay=oid=>{
  const o=findBy(db.orders,oid);if(!o)return;
  const u=cu();if(!u||u.id!==o.customerId)return;
  if(o.status!=='awaiting_payment')return toast('Неверный статус','error');
  const r=holdFunds(u.id,o.id,o.price);
  if(!r.ok)return toast(r.error,'error');
  o.status='in_progress';o.updatedAt=Date.now();
  saveDB();toast('Оплачено. Исполнитель начинает работу','success');render();
};
window.handleChangeExecutor=oid=>{
  const o=findBy(db.orders,oid);if(!o)return;
  const u=cu();if(!u||u.id!==o.customerId)return;
  if(!confirm('Вернуть заказ к выбору исполнителя?'))return;
  o.executorId=null;o.status='created';o.updatedAt=Date.now();
  db.proposals.filter(p=>p.orderId===oid).forEach(p=>p.status='pending');
  saveDB();toast('Заказ снова открыт','success');render();
};
window.handleSubmitResult=oid=>{const o=findBy(db.orders,oid);if(!o)return;
  const t=document.getElementById('result-text').value.trim();
  if(!t)return toast('Введите результат','error');
  o.resultText=t;o.status='result_submitted';o.updatedAt=Date.now();
  saveDB();toast('Результат отправлен','success');render()};
window.handleConfirm=oid=>{if(!confirm('Подтвердить? Деньги уйдут исполнителю.'))return;
  const o=findBy(db.orders,oid);if(!o)return;
  const r=releaseToExecutor(oid);if(!r.ok)return toast(r.error,'error');
  o.status='paid_out';o.updatedAt=Date.now();saveDB();toast('Оплата переведена','success');render()};
window.handleCancel=oid=>{if(!confirm('Отменить заявку?'))return;
  const o=findBy(db.orders,oid);if(!o)return;
  if(['in_progress','result_submitted'].includes(o.status))refundCustomer(oid);
  o.status='cancelled';o.updatedAt=Date.now();
  saveDB();toast('Заявка отменена','success');render()};
window.handleReview=(oid,toId,starsN)=>{const u=cu();if(!u)return;
  if(db.reviews.find(r=>r.orderId===oid&&r.fromId===u.id))return;
  db.reviews.push({id:uid(),orderId:oid,fromId:u.id,toId,stars:starsN,createdAt:Date.now()});
  const target=findBy(db.users,toId);
  if(target){const total=target.rating*target.ratingCount+starsN;target.ratingCount+=1;target.rating=total/target.ratingCount}
  saveDB();toast('Спасибо за отзыв!','success');render()};
window.handleSendMessage=(e,oid)=>{e.preventDefault();const u=cu();if(!u)return;
  const inp=document.getElementById('chat-inp'),body=inp.value.trim();if(!body)return;
  db.messages.push({id:uid(),orderId:oid,senderId:u.id,body,createdAt:Date.now()});
  saveDB();render();setTimeout(()=>{const c=document.getElementById('chat-msgs');if(c)c.scrollTop=c.scrollHeight},30)};
window.handleDispute=oid=>{const u=cu();if(!u)return;
  const r=document.getElementById('disp-reason').value.trim();
  if(r.length<5)return toast('Опишите проблему','error');
  const o=findBy(db.orders,oid);if(!o)return;
  db.disputes.push({id:uid(),orderId:oid,initiatorId:u.id,reason:r,status:'open',resolution:null,createdAt:Date.now()});
  o.status='disputed';o.updatedAt=Date.now();
  saveDB();toast('Спор открыт','success');render()};
window.applyFilter=()=>{const s=document.getElementById('f-subj').value.trim();
  const mn=Number(document.getElementById('f-min').value)||0,mx=Number(document.getElementById('f-max').value)||Infinity;
  let l=db.orders.filter(o=>o.status==='created');
  if(s)l=l.filter(o=>o.subject===s);
  l=l.filter(o=>o.price>=mn&&o.price<=mx);
  document.getElementById('orders-list').innerHTML=renderOrderGrid(l)};
window.handleDepositRequest=()=>{const u=cu();if(!u)return;
  const amt=Number(document.getElementById('dep-amt').value),cmt=document.getElementById('dep-cmt').value.trim();
  if(!amt||amt<db.settings.minDeposit)return toast('Минимум '+money(db.settings.minDeposit),'error');
  db.deposits.push({id:uid(),userId:u.id,amount:amt,comment:cmt,status:'pending',createdAt:Date.now()});
  saveDB();toast('Заявка отправлена','success');nav('wallet',{tab:'deposit'})};
window.handleWithdrawRequest=()=>{const u=cu();if(!u)return;
  const amt=Number(document.getElementById('wd-amt').value),dest=document.getElementById('wd-dest').value.trim(),service=document.getElementById('wd-service').value;
  if(!amt||amt<db.settings.minWithdraw)return toast('Минимум '+money(db.settings.minWithdraw),'error');
  if(amt>u.balance)return toast('Недостаточно средств','error');
  if(dest.length<5)return toast('Укажите реквизиты','error');
  u.balance-=amt;
  db.transactions.push({id:uid(),userId:u.id,orderId:null,type:'withdrawal',amount:-amt,balanceAfter:u.balance,createdAt:Date.now()});
  db.withdrawals.push({id:uid(),userId:u.id,publicId:u.publicId,amount:amt,destination:dest,service,status:'pending',createdAt:Date.now()});
  saveDB();toast('Заявка создана','success');nav('wallet',{tab:'withdraw'})};
window.handleManualCredit=()=>{
  const pid=document.getElementById('mc-id').value.trim();
  const amt=Number(document.getElementById('mc-amt').value);
  const note=document.getElementById('mc-note').value.trim();
  const el=document.getElementById('mc-result');
  if(!pid){el.innerHTML=`<div class="error-box">Введите ID</div>`;return}
  if(!amt||amt<=0){el.innerHTML=`<div class="error-box">Введите сумму</div>`;return}
  const u=findById(db.users,pid);
  if(!u){el.innerHTML=`<div class="error-box">ID ${esc(pid)} не найден</div>`;return}
  u.balance+=amt;
  db.transactions.push({id:uid(),userId:u.id,orderId:null,type:'deposit',amount:amt,balanceAfter:u.balance,createdAt:Date.now()});
  db.manualCredits.push({id:uid(),userId:u.id,publicId:pid,amount:amt,note,createdAt:Date.now()});
  saveDB();
  el.innerHTML=`<div class="success-box">✓ Зачислено ${money(amt)} пользователю <b>${esc(u.fullName)}</b>. Баланс: ${money(u.balance)}</div>`;
  document.getElementById('mc-id').value='';document.getElementById('mc-note').value='';
};
window.handleQuickCredit=pid=>{
  const u=findById(db.users,String(pid));if(!u)return toast('Не найден','error');
  const s=prompt(`Зачислить ${u.fullName} (ID ${u.publicId}).\nБаланс: ${money(u.balance)}\n\nСумма в ₽:`,'300');
  if(s===null)return;
  const amt=Number(s);if(!amt||amt<=0)return toast('Неверная сумма','error');
  u.balance+=amt;
  db.transactions.push({id:uid(),userId:u.id,orderId:null,type:'deposit',amount:amt,balanceAfter:u.balance,createdAt:Date.now()});
  db.manualCredits.push({id:uid(),userId:u.id,publicId:u.publicId,amount:amt,note:'быстрое зачисление',createdAt:Date.now()});
  saveDB();toast('Зачислено '+money(amt),'success');render();
};
window.handleApproveDeposit=id=>{const d=findBy(db.deposits,id);if(!d||d.status!=='pending')return;
  const u=findBy(db.users,d.userId);if(!u)return;
  u.balance+=d.amount;
  db.transactions.push({id:uid(),userId:u.id,orderId:null,type:'deposit',amount:d.amount,balanceAfter:u.balance,createdAt:Date.now()});
  d.status='approved';saveDB();toast('Зачислено '+money(d.amount),'success');render()};
window.handleRejectDeposit=id=>{const d=findBy(db.deposits,id);if(!d)return;
  if(!confirm('Отклонить?'))return;d.status='rejected';saveDB();toast('Отклонено','success');render()};
window.handleCompleteWithdrawal=id=>{const w=findBy(db.withdrawals,id);if(!w||w.status!=='pending')return;
  if(!confirm('Отметить как выполненный?'))return;w.status='completed';saveDB();toast('Готово','success');render()};
window.handleRejectWithdrawal=id=>{const w=findBy(db.withdrawals,id);if(!w||w.status!=='pending')return;
  if(!confirm('Отклонить и вернуть на баланс?'))return;
  const u=findBy(db.users,w.userId);u.balance+=w.amount;
  db.transactions.push({id:uid(),userId:u.id,orderId:null,type:'refund',amount:w.amount,balanceAfter:u.balance,createdAt:Date.now()});
  w.status='rejected';saveDB();toast('Возвращено','success');render()};
window.handleResolveDispute=(id,res)=>{const d=findBy(db.disputes,id);if(!d)return;
  const o=findBy(db.orders,d.orderId);if(!o)return;
  if(res==='refund'){refundCustomer(o.id);o.status='refunded'}else{releaseToExecutor(o.id);o.status='paid_out'}
  d.status='resolved';d.resolution=res;o.updatedAt=Date.now();
  saveDB();toast('Спор решён','success');render()};
window.handleToggleBlock=id=>{const u=findBy(db.users,id);if(!u)return;
  u.blocked=!u.blocked;saveDB();toast(u.blocked?'Заблокирован':'Разблокирован','success');render()};
window.handleSaveSettings=()=>{
  db.settings.cardNumber=document.getElementById('s-card').value.trim();
  db.settings.cardHolder=document.getElementById('s-holder').value.trim();
  db.settings.bankName=document.getElementById('s-bank').value.trim();
  const c=Number(document.getElementById('s-comm').value);
  if(c>=0&&c<=50)db.settings.commissionRate=c/100;
  db.settings.minDeposit=Number(document.getElementById('s-mindep').value)||100;
  db.settings.minWithdraw=Number(document.getElementById('s-minwd').value)||300;
  saveDB();toast('Сохранено','success');render()};
window.handleExportData=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='studentmarket-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Копия скачана','success');
};
window.handleFullReset=()=>{
  if(!confirm('Полный сброс: удалит ВСЕ данные (включая Firebase). Продолжить?'))return;
  if(!confirm('Точно? Необратимо.'))return;
  localStorage.removeItem(DB_KEY);localStorage.removeItem('sm_session');localStorage.removeItem('sm_adminReturn');
  if(firebaseReady)firebaseRef.remove().finally(()=>location.reload());
  else location.reload();
};

// ============================================================
// 5. RENDER
// ============================================================
function render(){
  const u=cu();let content='';
  if(route.name==='login')content=pageLogin();
  else if(route.name==='register')content=pageRegister();
  else if(route.name==='home')content=pageHome();
  else if(route.name==='create')content=pageCreate();
  else if(route.name==='order')content=pageOrder(route.params);
  else if(route.name==='my')content=pageMy();
  else if(route.name==='wallet')content=pageWallet(route.params);
  else if(route.name==='admin')content=pageAdmin(route.params);
  else content=pageHome();

  const isAuth=route.name==='login'||route.name==='register';
  const showAdminReturn=u&&u.role!=='admin'&&adminReturn;
  const header=isAuth?'':`<header class="header">
    <div class="header-row">
      <div class="logo" onclick="nav('home')">Student<span>Market</span></div>
      <div class="user-chip">
        ${u?`<div class="avatar">${esc(initials(u.fullName))}</div>
             <span class="id-pill">${esc(u.publicId)}</span>
             <button class="secondary small" onclick="logout()">Выйти</button>`
            :`<button class="small" onclick="nav('login')">Войти</button>`}
      </div>
    </div>
    <nav>
      <a class="${route.name==='home'?'active':''}" onclick="nav('home')">Заявки</a>
      ${u?`<a class="${route.name==='my'?'active':''}" onclick="nav('my')">Мои</a>`:''}
      ${u&&u.role!=='executor'?`<a class="${route.name==='create'?'active':''}" onclick="nav('create')">Создать</a>`:''}
      ${u?`<a class="${route.name==='wallet'?'active':''}" onclick="nav('wallet')">Кошелёк · ${u.isUnlimited?'∞':u.balance.toFixed(0)+' ₽'}</a>`:''}
      ${u&&u.role==='admin'?`<a class="${route.name==='admin'?'active':''}" onclick="nav('admin')">Админ</a>`:''}
    </nav>
    ${showAdminReturn?`<div class="as-banner" style="margin-top:10px">
      <span>Тестовый режим: <b>${esc(u.fullName)}</b></span>
      <button onclick="handleReturnToAdmin()">← К админу</button>
    </div>`:''}
  </header>`;

  document.getElementById('app').innerHTML=header+`<div class="container">${content}</div>`;
  const c=document.getElementById('chat-msgs');
  if(c)c.scrollTop=c.scrollHeight;
}

// ============================================================
// 6. ИНИЦИАЛИЗАЦИЯ
// ============================================================
loadDB();

if(firebaseReady){
  // Слушаем изменения из Firebase
  firebaseRef.on('value',(snap)=>{
    // Игнорируем эхо собственной записи
    if(Date.now()-_lastSaveTime<1500)return;
    const remote=snap.val();
    if(!remote){
      // Firebase пустой — заливаем локальные данные
      saveDB();
      return;
    }
    // Заменяем локальные данные на серверные, сохраняя локальную сессию
    db=Object.assign(defaultDB(),remote);
    if(!db.settings)db.settings={cardNumber:'',cardHolder:'',bankName:'',commissionRate:.10,minWithdraw:300,minDeposit:100};
    saveLocal();
    render();
  },(err)=>console.warn('Firebase listen error:',err));
} else {
  // Локальный режим — создаём админа если пусто
  if(!db.users.length){
    const a={id:uid(),publicId:genPublicId([]),email:'admin@example.com',password:'password123',
      fullName:'Администратор',role:'admin',balance:0,heldBalance:0,totalEarned:0,blocked:false,
      isUnlimited:true,ip:'—',deviceId:'—',lastSeen:Date.now(),rating:0,ratingCount:0,createdAt:Date.now()};
    db.users=[a];
    saveDB();
  }
}

render();
setInterval(()=>{const u=cu();if(u){u.lastSeen=Date.now();saveDB()}},60000);
window.addEventListener('focus',()=>{recordPresence().then(()=>{if(route.name==='admin')render()})});
</script>
