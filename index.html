<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Test</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px">
<div id="app">Загрузка...</div>
<script>
window.onerror = function(msg, url, line) {
  document.getElementById('app').innerHTML = '<h1 style="color:red">ОШИБКА:</h1><p>' + msg + '</p><p>Строка: ' + line + '</p>';
  return false;
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script>
  if(typeof firebase === 'undefined') {
    document.getElementById('app').innerHTML = '<h1 style="color:red">БЛОКИРОВКА:</h1><p>Скрипт Firebase не загрузился. Проверь VPN или DNS.</p>';
  } else {
    document.getElementById('app').innerHTML = '<h1 style="color:green">УСПЕХ:</h1><p>Firebase загрузился. Значит, ошибка в коде приложения.</p>';
  }
</script>
</body>
</html>
