.attach-preview{background:var(--c2);border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}

var AGREE_TEXT='ПОЛЬЗОВАТЕЛЬСКОЕ СОГЛАШЕНИЕ Ghost Market\n\n1. ОБЩИЕ ПОЛОЖЕНИЯ\nСервис Ghost Market — площадка для размещения и выполнения учебных заданий. Регистрируясь, вы подтверждаете, что вам исполнилось 14 лет и принимаете условия в полном объёме.\n\n2. ОБРАБОТКА ПЕРСОНАЛЬНЫХ ДАННЫХ (152-ФЗ)\n2.1. Вы даёте согласие на обработку: email, имени, IP-адреса, данных об устройстве, истории действий на платформе.\n2.2. Цели: идентификация, работа сервиса, предотвращение мошенничества, связь.\n2.3. Данные не передаются третьим лицам кроме случаев, предусмотренных законом.\n\n3. ФИНАНСОВЫЕ ОПЕРАЦИИ\n3.1. Эскроу-механизм: средства замораживаются до подтверждения выполнения.\n3.2. Комиссия удерживается с каждой успешной сделки.\n3.3. Пользователь сам отвечает за уплату налогов.\n\n4. ЗАПРЕЩЕНО\n4.1. Экзамены, ЕГЭ, ОГЭ, дипломные работы.\n4.2. Мошенничество, обмен вне платформы.\n4.3. Вредоносные файлы и чужие персональные данные.\n\n5. ОТВЕТСТВЕННОСТЬ\nПлатформа не отвечает за качество работ пользователей. Споры — через внутренний арбитраж.\n\n6. ОТЗЫВ СОГЛАСИЯ\nСогласие можно отозвать, написав администрации. Аккаунт будет удалён.';

var D={users:{},orders:{},chats:{},msgs:{},txs:{},deps:{},wds:{},disps:{},revs:{},notifs:{},settings:{}};
var FU=null,SID=localStorage.getItem('gm_sid'),route={name:'home',params:{}};
var pendingFile=null;
var mediaRec=null,mediaChunks=[],recTimer=null,recStart=0;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toFixed(2)+' ₽'}
function dt(ts){return new Date(ts||Date.now()).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function ini(n){return (n||'?').split(' ').map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function onl(u){return u&&u.lastSeen&&(Date.now()-u.lastSeen<5*60*1000)}
function me(){return SID?D.users[SID]:null}
function unl(u){return u&&(u.isUnlimited||u.role==='admin')}
function uByPid(pid){var k=Object.keys(D.users);for(var i=0;i<k.length;i++){if(String(D.users[k[i]].publicId)===String(pid))return[k[i],D.users[k[i]]]}return null}
function toast(m,t){var e=document.createElement('div');e.className='tst '+(t||'');e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},3000)}
function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Скопировано','success')}).catch(function(){fb(t)});else fb(t)}
function fb(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано','success')}catch(e){toast('Ошибка','error')}a.remove()}
function nav(n,p){route={name:n,params:p||{}};render();window.scrollTo(0,0)}
function fp(){try{var s=[navigator.userAgent||'',navigator.language||'',screen.width+'x'+screen.height].join('|');var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return'DEV-'+Math.abs(h).toString(36).toUpperCase()}catch(e){return'DEV-X'}}
function genPid(){var ids=Object.keys(D.users).map(function(k){return String(D.users[k].publicId)});var i;do{i=String(Math.floor(10000000+Math.random()*90000000))}while(ids.indexOf(i)>=0);return i}
function fmtSize(b){if(b<1024)return b+' Б';if(b<1024*1024)return Math.round(b/1024)+' КБ';return (b/1024/1024).toFixed(1)+' МБ'}

function notify(userId,type,title,body,link){
  if(!userId)return;
  var id=uid();
  DB.child('notifs/'+userId+'/'+id).set({id:id,type:type,title:title,body:body,link:link||null,read:false,createdAt:Date.now()});
}
function unreadNotif(){
  if(!SID||!D.notifs[SID])return 0;
  var arr=D.notifs[SID],c=0;
  Object.keys(arr).forEach(function(k){if(!arr[k].read)c++});
  return c;
}
function notifList(){
  if(!SID||!D.notifs[SID])return [];
  var arr=D.notifs[SID];
  return Object.keys(arr).map(function(k){return arr[k]}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).slice(0,100);
}

function hold(uid_,oid,amt){
  var u=D.users[uid_];if(!u)return{ok:false,error:'Нет юзера'};
  if(unl(u)){var t=uid();DB.child('txs/'+t).set({id:t,userId:uid_,orderId:oid,type:'hold',amount:-amt,balanceAfter:0,createdAt:Date.now()});return{ok:true}}
  if((u.balance||0)<amt)return{ok:false,error:'Недостаточно средств'};
  var nb=(u.balance||0)-amt;
  DB.child('users/'+uid_).update({balance:nb,heldBalance:(u.heldBalance||0)+amt});
  var t=uid();DB.child('txs/'+t).set({id:t,userId:uid_,orderId:oid,type:'hold',amount:-amt,balanceAfter:nb,createdAt:Date.now()});
  return{ok:true}
}
function payout(orderId){
  var o=D.orders[orderId];if(!o||!o.executorId)return;
  var c=D.users[o.customerId],e=D.users[o.executorId];if(!c||!e)return;
  var pay=+(o.price*(1-o.commissionRate)).toFixed(2),com=+(o.price*o.commissionRate).toFixed(2);
  if(!unl(c))DB.child('users/'+c.id+'/heldBalance').set(Math.max(0,(c.heldBalance||0)-o.price));
  if(!unl(e))DB.child('users/'+e.id).update({balance:(e.balance||0)+pay,totalEarned:(e.totalEarned||0)+pay});
  var t1=uid();DB.child('txs/'+t1).set({id:t1,userId:e.id,orderId:orderId,type:'payout',amount:pay,createdAt:Date.now()});
  var t2=uid();DB.child('txs/'+t2).set({id:t2,userId:c.id,orderId:orderId,type:'commission',amount:-com,createdAt:Date.now()});
  notify(e.id,'payout','Заказ выполнен','Вам зачислено '+money(pay),'#wallet');
}
function refund(orderId){
  var o=D.orders[orderId];if(!o)return;
  var u=D.users[o.customerId];if(!u||unl(u))return;
  var nb=(u.balance||0)+o.price;
  DB.child('users/'+u.id).update({balance:nb,heldBalance:Math.max(0,(u.heldBalance||0)-o.price)});
  var t=uid();DB.child('txs/'+t).set({id:t,userId:u.id,orderId:orderId,type:'refund',amount:o.price,balanceAfter:nb,createdAt:Date.now()});
  notify(u.id,'refund','Возврат средств','Вам возвращено '+money(o.price),'#wallet');
}

    (u?'<a class="'+(route.name==='myorders'?'on':'')+'" onclick="nav(\'myorders\')">Мои</a>':'')+
    (u?'<a class="'+(route.name==='chats'?'on':'')+'" onclick="nav(\'chats\')">Чаты'+(unread?'<span class="b">'+unread+'</span>':'')+'</a>':'')+

    (u?'<a class="'+(route.name==='wallet'?'on':'')+'" onclick="nav(\'wallet\')">Кошелёк · '+(unl(u)?'∞':(u.balance||0).toFixed(0)+' ₽')+'</a>':'')+

function renderMsg(m){
  var s=D.users[m.senderId]||{};
  var body='<div class="who">'+esc(s.fullName||'—')+'</div>';
  if(m.body)body+='<p>'+esc(m.body)+'</p>';
  if(m.attachment){
    var at=m.attachment;
    if(at.type==='image')body+='<img src="'+at.data+'" alt="фото">';
    else if(at.type==='voice')body+='<audio controls src="'+at.data+'"></audio>';
    else if(at.type==='circle')body+='<video controls src="'+at.data+'" playsinline></video>';
    else if(at.type==='pdf'||at.type==='file')body+='<a class="file-link" href="'+at.data+'" download="'+esc(at.name)+'">📄 '+esc(at.name)+' · '+fmtSize(at.size||0)+'</a>';
  }
  body+='<small>'+dt(m.createdAt)+'</small>';
  return'<div class="msg '+(m.senderId===SID?'mine':'')+'">'+body+'</div>';
}

window.doLogin=function(e){e.preventDefault();var fd=new FormData(e.target);auth.signInWithEmailAndPassword(fd.get('email').trim().toLowerCase(),fd.get('password')).then(function(cred){
  if(!cred.user.emailVerified){route={name:'verify',params:{}};render()}
  else toast('Добро пожаловать','success');
}).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'})};

window.doReg=function(e){
  e.preventDefault();
  var fd=new FormData(e.target);
  var email=fd.get('email').trim().toLowerCase();
  var pw=fd.get('password');
  var name=fd.get('fullName').trim();
  var agreed=fd.get('agree');
  if(!agreed){document.getElementById('aerr').innerHTML='<div class="err">Нужно принять соглашение</div>';return}
  if(pw.length<6){document.getElementById('aerr').innerHTML='<div class="err">Пароль короткий</div>';return}
  auth.createUserWithEmailAndPassword(email,pw).then(function(cred){
    var uid_=cred.user.uid;
    var pid=genPid();
    var isAdmin=(email===ADMIN_EMAIL);
    var user={id:uid_,publicId:pid,email:email,fullName:name,role:isAdmin?'admin':'user',balance:0,heldBalance:0,totalEarned:0,blocked:false,isUnlimited:isAdmin,ip:'—',deviceId:fp(),lastSeen:Date.now(),rating:0,ratingCount:0,emailVerified:false,isNew:!isAdmin,createdAt:Date.now(),agreedAt:Date.now()};
    DB.child('users/'+uid_).set(user).then(function(){
      cred.user.sendEmailVerification().then(function(){
        toast('Письмо отправлено','success');
        route={name:'verify',params:{}};render();
      }).catch(function(err){alert('Ошибка: '+err.message);route={name:'verify',params:{}};render()});
    });
  }).catch(function(err){document.getElementById('aerr').innerHTML='<div class="err">'+err.message+'</div>'});
};

window.doRespond=function(orderId){
  var u=me();if(!u)return;
  var o=D.orders[orderId];if(!o)return;
  var msg=document.getElementById('resp-msg').value.trim();
  var price=Number(document.getElementById('resp-price').value)||o.price;
  if(!msg){toast('Напишите сообщение','error');return}
  if(o.customerId===u.id){toast('Это ваша заявка','error');return}
  var chatId=uid();
  DB.child('chats/'+chatId).set({id:chatId,orderId:orderId,customerId:o.customerId,executorId:u.id,lastAt:Date.now(),lastMsg:msg.slice(0,60),respPrice:price}).then(function(){
    var mid=uid();
    DB.child('msgs/'+chatId+'/'+mid).set({id:mid,chatId:chatId,senderId:u.id,body:msg,createdAt:Date.now()});
    notify(o.customerId,'resp','Новый отклик','На вашу заявку откликнулся '+u.fullName,'#myorders');
    toast('Отклик отправлен','success');render();
  });
};

window.chooseExec=function(orderId,execId,chatId){
  var u=me();if(!u)return;
  var o=D.orders[orderId];if(!o||o.customerId!==u.id)return;
  if(!confirm('Выбрать этого исполнителя? Заявка перейдёт в работу.'))return;
  DB.child('orders/'+orderId).update({executorId:execId,status:'taken',updatedAt:Date.now()}).then(function(){
    notify(execId,'chosen','Вас выбрали','По заявке «'+o.title+'» вас выбрали исполнителем','#myorders');
    toast('Исполнитель выбран','success');render();
  });
};

window.submitResult=function(orderId){var u=me();if(!u)return;var o=D.orders[orderId];if(!o||o.executorId!==u.id)return;var t=document.getElementById('res-t').value.trim();if(!t){toast('Введите результат','error');return}DB.child('orders/'+orderId).update({resultText:t,status:'submitted',updatedAt:Date.now()}).then(function(){notify(o.customerId,'result','Результат отправлен','Проверьте работу','#myorders');toast('Отправлено','success');render()})};

window.confirmDone=function(orderId){if(!confirm('Подтвердить и выплатить?'))return;var o=D.orders[orderId];if(!o)return;payout(orderId);DB.child('orders/'+orderId).update({status:'done',updatedAt:Date.now()}).then(function(){toast('Выплата произведена','success');render()})};

window.cancelOrder=function(orderId){if(!confirm('Отменить?'))return;var o=D.orders[orderId];if(!o)return;if(o.status==='taken'||o.status==='submitted')refund(orderId);DB.child('orders/'+orderId).update({status:'cancelled',updatedAt:Date.now()}).then(function(){toast('Отменено');render()})};

window.doDispute=function(orderId){var r=document.getElementById('disp-r').value.trim();if(r.length<5){toast('Опишите','error');return}var id=uid();DB.child('disps/'+id).set({id:id,orderId:orderId,initiatorId:SID,reason:r,status:'open',createdAt:Date.now()}).then(function(){DB.child('orders/'+orderId+'/status').set('disputed');toast('Спор открыт','success');render()})};

window.openChat=function(orderId,execId,custId){var exist=Object.keys(D.chats).map(function(k){return D.chats[k]}).find(function(c){return c.orderId===orderId&&c.executorId===execId});if(exist){nav('chat',{id:exist.id});return}var id=uid();DB.child('chats/'+id).set({id:id,orderId:orderId,customerId:custId,executorId:execId,lastAt:Date.now(),lastMsg:'Чат создан'}).then(function(){nav('chat',{id:id})})};

window.sendMsg=function(e,chatId){
  e.preventDefault();
  var inp=document.getElementById('cinp');
  var body=inp.value.trim();
  if(!body&&!pendingFile){return}
  var msg={id:uid(),chatId:chatId,senderId:SID,body:body||'',createdAt:Date.now()};
  if(pendingFile){msg.attachment=pendingFile}
  DB.child('msgs/'+chatId+'/'+msg.id).set(msg).then(function(){
    var c=D.chats[chatId]||{};
    var upd={lastAt:Date.now(),lastMsg:(body||(pendingFile?'📎 Файл':'')).slice(0,60)};
    if(c.customerId===SID)upd.eU=true;else upd.cU=true;
    DB.child('chats/'+chatId).update(upd);
    var otherId=c.customerId===SID?c.executorId:c.customerId;
    notify(otherId,'msg','Новое сообщение',body||'📎 Файл','#chat');
    inp.value='';pendingFile=null;
    var slot=document.getElementById('attach-slot');if(slot)slot.innerHTML='';
  });
};

window.pickFile=function(){document.getElementById('file-input').click()};
window.onFilePicked=function(e){
  var f=e.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){toast('Файл больше 2 МБ','error');return}
  var reader=new FileReader();
  reader.onload=function(){
    pendingFile={type:f.type.indexOf('image')===0?'image':(f.type==='application/pdf'?'pdf':'file'),name:f.name,size:f.size,data:reader.result};
    var slot=document.getElementById('attach-slot');
    slot.innerHTML='<div class="attach-preview"><span>📎 '+esc(f.name)+' · '+fmtSize(f.size)+'</span><button type="button" class="dgr" onclick="cancelAttach()">×</button></div>';
  };
  reader.readAsDataURL(f);
  e.target.value='';
};
window.cancelAttach=function(){pendingFile=null;var s=document.getElementById('attach-slot');if(s)s.innerHTML=''};

window.toggleVoice=function(){
  var btn=document.getElementById('voice-btn');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Микрофон недоступен');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaChunks=[];
    mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=function(e){if(e.data.size>0)mediaChunks.push(e.data)};
    mediaRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var blob=new Blob(mediaChunks,{type:'audio/webm'});
      if(blob.size>1024*1024){toast('Слишком длинное','error');clearRecUI();return}
      var reader=new FileReader();
      reader.onload=function(){
        var slot=document.getElementById('attach-slot');
        pendingFile={type:'voice',name:'Голосовое',size:blob.size,data:reader.result};
        slot.innerHTML='<div class="attach-preview"><span>🎤 Голосовое · '+fmtSize(blob.size)+'</span><button type="button" class="dgr" onclick="cancelAttach()">×</button></div>';
        clearRecUI();
      };
      reader.readAsDataURL(blob);
    };
    mediaRec.start();
    btn.classList.add('rec');btn.textContent='■';
    recStart=Date.now();
    recTimer=setInterval(function(){
      var sec=Math.floor((Date.now()-recStart)/1000);
      var slot=document.getElementById('rec-slot');
      slot.innerHTML='<div class="rec-bar"><span>🔴 Запись... '+sec+' сек</span><button type="button" class="sm dgr" onclick="toggleVoice()">Стоп</button></div>';
      if(sec>=30)toggleVoice();
    },500);
  }).catch(function(err){alert('Нет доступа к микрофону: '+err.message)});
};
function clearRecUI(){
  var btn=document.getElementById('voice-btn');
  if(btn){btn.classList.remove('rec');btn.textContent='🎤'}
  var slot=document.getElementById('rec-slot');if(slot)slot.innerHTML='';
  if(recTimer){clearInterval(recTimer);recTimer=null}
}

window.doDep=function(){var u=me();if(!u)return;var amt=Number(document.getElementById('dep-a').value);var cmt=document.getElementById('dep-c').value.trim();if(!amt||amt<10){toast('Минимум 10 ₽','error');return}var id=uid();DB.child('deps/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,comment:cmt,status:'pending',createdAt:Date.now()}).then(function(){toast('Заявка отправлена','success');nav('wallet',{tab:'dep'})})};

window.doWd=function(){var u=me();if(!u)return;var amt=Number(document.getElementById('wd-a').value);var svc=document.getElementById('wd-s').value;var dst=document.getElementById('wd-d').value.trim();var mw=(D.settings&&D.settings.minWithdraw)||300;if(!amt||amt<mw){toast('Минимум '+money(mw),'error');return}if(amt>(u.balance||0)){toast('Недостаточно','error');return}if(dst.length<5){toast('Укажите реквизиты','error');return}var id=uid();DB.child('users/'+SID).update({balance:(u.balance||0)-amt}).then(function(){DB.child('wds/'+id).set({id:id,userId:SID,publicId:u.publicId,amount:amt,service:svc,dest:dst,status:'pending',createdAt:Date.now()});var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:SID,type:'withdrawal',amount:-amt,balanceAfter:(u.balance||0)-amt,createdAt:Date.now()});toast('Заявка создана','success');nav('wallet',{tab:'wd'})})};

window.adminCredit=function(){var pid=document.getElementById('mc-i').value.trim();var amt=Number(document.getElementById('mc-a').value);var el=document.getElementById('mcr');if(!pid){el.innerHTML='<div class="err">Введите ID</div>';return}if(!amt||amt<=0){el.innerHTML='<div class="err">Введите сумму</div>';return}var res=uByPid(pid);if(!res){el.innerHTML='<div class="err">ID не найден</div>';return}var userId=res[0],uu=res[1];var nb=(uu.balance||0)+amt;DB.child('users/'+userId+'/balance').set(nb).then(function(){var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:userId,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});notify(userId,'credit','Баланс пополнен','Зачислено '+money(amt),'#wallet');el.innerHTML='<div class="suc">✓ Зачислено '+money(amt)+' для <b>'+esc(uu.fullName)+'</b></div>';document.getElementById('mc-i').value=''})};
window.adminQuick=function(pid){var res=uByPid(String(pid));if(!res){toast('Не найден','error');return}var id=res[0],uu=res[1];var s=prompt('Зачислить '+uu.fullName+'\nБаланс: '+money(uu.balance||0)+'\n\nСумма:','300');if(s===null)return;var amt=Number(s);if(!amt||amt<=0)return;var nb=(uu.balance||0)+amt;DB.child('users/'+id+'/balance').set(nb).then(function(){var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:id,type:'deposit',amount:amt,balanceAfter:nb,createdAt:Date.now()});notify(id,'credit','Баланс пополнен','Зачислено '+money(amt),'#wallet');toast('Зачислено '+money(amt),'success');render()})};
window.adminDep=function(id,act){var d=D.deps[id];if(!d||d.status!=='pending')return;if(act==='ok'){var uu=D.users[d.userId];if(!uu)return;var nb=(uu.balance||0)+d.amount;DB.child('users/'+d.userId+'/balance').set(nb).then(function(){var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:d.userId,type:'deposit',amount:d.amount,balanceAfter:nb,createdAt:Date.now()});DB.child('deps/'+id+'/status').set('approved');notify(d.userId,'dep','Пополнение','Зачислено '+money(d.amount),'#wallet');toast('Зачислено','success');render()})}else{DB.child('deps/'+id+'/status').set('rejected').then(function(){toast('Отклонено');render()})}};
window.adminWd=function(id,act){var w=D.wds[id];if(!w||w.status!=='pending')return;if(act==='ok'){DB.child('wds/'+id+'/status').set('completed').then(function(){notify(w.userId,'wd','Вывод выполнен','Заявка на '+money(w.amount)+' выполнена','#wallet');toast('Готово');render()})}else{var uu=D.users[w.userId];if(uu){var nb=(uu.balance||0)+w.amount;DB.child('users/'+w.userId+'/balance').set(nb);var tid=uid();DB.child('txs/'+tid).set({id:tid,userId:w.userId,type:'refund',amount:w.amount,balanceAfter:nb,createdAt:Date.now()})}DB.child('wds/'+id+'/status').set('rejected').then(function(){toast('Возвращено');render()})}};
window.adminDisp=function(id,res){var d=D.disps[id];if(!d||d.status!=='open')return;var o=D.orders[d.orderId];if(!o)return;if(res==='refund'){refund(d.orderId);DB.child('orders/'+d.orderId+'/status').set('cancelled')}else{payout(d.orderId);DB.child('orders/'+d.orderId+'/status').set('done')}DB.child('disps/'+id).update({status:'resolved',resolution:res}).then(function(){toast('Спор решён');render()})};
window.adminBlock=function(id){var uu=D.users[id];if(!uu)return;DB.child('users/'+id+'/blocked').set(!uu.blocked).then(function(){toast(uu.blocked?'Разблокирован':'Заблокирован','success');render()})};
window.adminSave=function(){DB.child('settings').update({cardNumber:document.getElementById('s-card').value.trim(),cardHolder:document.getElementById('s-holder').value.trim(),bankName:document.getElementById('s-bank').value.trim(),commissionRate:Number(document.getElementById('s-comm').value)/100,minDeposit:Number(document.getElementById('s-md').value)||100,minWithdraw:Number(document.getElementById('s-mw').value)||300}).then(function(){toast('Сохранено','success')})};
window.applyF=function(){var c=document.getElementById('f-c').value;var mn=Number(document.getElementById('f-mn').value)||0;var mx=Number(document.getElementById('f-mx').value)||Infinity;var list=Object.keys(D.orders).map(function(k){return D.orders[k]}).filter(function(o){return o.status==='open'});if(c)list=list.filter(function(o){return o.category===c});list=list.filter(function(o){return o.price>=mn&&o.price<=mx});document.getElementById('lots').innerHTML=renderOrders(list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}))};
window.updHint=function(){var s=document.getElementById('cs').value;document.getElementById('ch').textContent=HINTS[s]||''};

render();
</script>
